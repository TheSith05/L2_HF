<html><body>
Эта функция управляет дверью клан-холла.<br1>
Когда дверь открыта, войти может кто угодно — даже те, кто не является членом клана. В целях безопасности вам следует держать дверь закрытой как можно чаще.<br>
Если вы хотите выгнать тех, кто не состоит в клане, используйте &nbsp;<a action="bypass -h npc_%objectId%_banish_foreigner banish">Выгнать чужаков</a>&nbsp; меню.<br><br>
<center>
<button value="Открыть" action="bypass -h npc_%objectId%_door open" width=80 height=27 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"><br><br>
<button value="Закрыть" action="bypass -h npc_%objectId%_door close" width=80 height=27 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"><br><br>
<button value="Начальный экран" action="bypass -h npc_%objectId%_list_back" width=80 height=27 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
</center>
</body></html>
