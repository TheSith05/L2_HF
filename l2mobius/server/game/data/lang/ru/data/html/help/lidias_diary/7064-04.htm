<html><body>Дневник Лидии:<br>
Двадцать второй день месяца Шилен.<br><br>
Я подслушала разговор отца, когда подавала чай гостю.<br>
Он все говорил и говорил о начале революции!
О чем он думает?<br>
Мы потеряли слишком много в последней войне, даже единственный брат бедной Роуз погиб!<br>
