<html><body>Дневник Лидии:<br>
Тринадцатый день месяца Шилен.<br><br>
Я встретила сегодня незнакомца по имени Нидра!
У него роскошная черная мантия и очень впечатляющие усы!
Роуз говорит, что он Темный Маг!
Что он здесь делает?<br>
