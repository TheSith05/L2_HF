<html><body>Ведьма Клео:<br>
Взгляни, ты, кто плетет нити с вершины башни, пока тебя обдувает ветер. Я владею мечом, который разрезает время. Передо мной все — суета... Все тщетно...<br>
Я — Полярная звезда, прибитая к ночному небу, и я — путеводный знак, брошенный в поток времени и пространства.<br>
