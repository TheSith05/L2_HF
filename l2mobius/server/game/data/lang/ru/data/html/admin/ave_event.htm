<html>
<head>
	<title>Меню визуальных эффектов событий</title>
</head>
<body>
	<center>
		<table width="270">
			<tr>
				<td width="45">
					<button value="Главная" action="bypass admin_admin" width="45" height="21" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
				<td width="180">
					<center>Эффекты событий</center>
				</td>
				<td width="45">
					<button value="Назад" action="bypass admin_admin3" width="45" height="21" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
			</tr>
		</table>
		<br>
		<table width="240">
			<tr>
				<td>
					Значения:
				</td>
				<td>
					<edit var="qbox" width="100" height="15">
				</td>
				<td>
					<button value="Помощь" action="bypass admin_html help/abnormal.htm" width="40" height="21" back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
			</tr>
		</table>
		<br>
		<table width=260>
			<tr>
				<td>
					<button value="Нет" action="bypass -h admin_ave_event BR_NONE $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
				<td>
					<button value="Афро (обычное)" action="bypass -h admin_ave_event BR_AFRO_NORMAL $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
				<td>
					<button value="Афро (розовое)" action="bypass -h admin_ave_event BR_AFRO_PINK $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
			</tr>
			<tr>
				<td>
					<button value="Афро (золотое)" action="bypass -h admin_ave_event BR_AFRO_GOLD $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
				<td>
					<button value="Гнев Евы" action="bypass -h admin_ave_event BR_POWER_OF_EVA $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
				<td>
					<button value="Наушники" action="bypass -h admin_ave_event BR_HEADPHONE $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
			</tr>
			<tr>
				<td>
					<button value="Vesper 1" action="bypass -h admin_ave_event BR_VESPER1 $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
				<td>
					<button value="Vesper 2" action="bypass -h admin_ave_event BR_VESPER2 $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
				<td>
					<button value="Vesper 3" action="bypass -h admin_ave_event BR_VESPER3 $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
			</tr>
			<tr>
				<td>
					<button value="Аватар души" action="bypass -h admin_ave_event BR_SOUL_AVATAR $qbox" width=90 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF">
				</td>
			</tr>
		</table>
	</center>
</body>
</html>
