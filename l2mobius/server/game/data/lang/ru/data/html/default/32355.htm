<html><body>Solomon:<br>
С вашей помощью мы наконец начали налаживать дружеские отношения с Караваном. Еда, которую мы получаем от них, — огромная помощь для нас, и я уверен, что рано или поздно мы доберемся до внешних ворот Стальной Цитадели — конечно, после прохождения Разрушенных Земель.
