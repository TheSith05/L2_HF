<html><body>Руководство по рыбалке:<br>
Для ночной рыбалки требуется <font color="LEVEL">флуоресцентная наживка</font>. Рыбу гораздо труднее поймать в темноте!<br>
Рыба, пойманная ночью, как правило, умнее другой рыбы и, как известно, использует <font color="LEVEL">свои навыки</font>, чтобы обмануть неосторожных рыбаков.<br>
