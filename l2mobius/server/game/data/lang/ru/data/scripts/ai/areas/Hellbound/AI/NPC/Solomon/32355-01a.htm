<html><body>Solomon:<br>
С вашей помощью мы наконец начали налаживать дружеские отношения с Караваном. Еда, которую мы от них получаем, — огромная помощь для нас, и я уверен, что рано или поздно мы доберемся до внешних ворот Цитадели Стали — конечно, после того, как пройдем Истерзанные Земли.</body></html>
