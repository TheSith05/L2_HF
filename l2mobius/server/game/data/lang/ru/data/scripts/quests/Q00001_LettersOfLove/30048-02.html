<html><body>Дарин:<br>
Что опаснее: меч рыцаря или посох мага? То, что мы называем любовью. Она подкрадывается тише вора, быстрее заката и захватывает твою душу. Менестрели правы: она сладка и горька одновременно! Я не могу сосредоточиться, не могу спать, не могу есть!<br>
<a action="bypass Script Q00001_LettersOfLove 30048-03.html">Спросить, кого он любит.</a>
