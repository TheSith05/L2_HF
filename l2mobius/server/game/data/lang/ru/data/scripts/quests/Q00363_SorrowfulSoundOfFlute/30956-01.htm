<html><body>Музыкант Нанарин:<br>
Должна признаться, его широкие плечи захватывают дух, а эта прекрасная борода покорила мою душу...<br>
Что мне делать? Я никогда раньше не чувствовала ничего подобного... Ты не мог бы мне помочь?<br>
<a action="bypass -h Script Q00363_SorrowfulSoundOfFlute START">«Я помогу тебе».</a>
</body></html>
