# ---------------------------------------------------------------------------
# База данных
# ---------------------------------------------------------------------------

# Укажите класс JDBC-драйвера для вашей базы данных.
# По умолчанию: com.mysql.cj.jdbc.Driver
Driver = com.mysql.cj.jdbc.Driver

# URL подключения к базе данных
# По умолчанию: jdbc:mysql://localhost/l2jmobiush5?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&interactiveClient=true&sessionVariables=wait_timeout=600,interactive_timeout=600&autoReconnect=true
URL = jdbc:mysql://l2-db:3306/l2jmobiushighfive?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true

# Данные пользователя базы данных. По умолчанию "root", но использовать его не рекомендуется.
Login = root

# Пароль пользователя базы данных, оставьте пустым, если пароль не требуется.
Password = root

# Максимальное количество соединений с базой данных, поддерживаемых в пуле.
# По умолчанию: 5
MaximumDatabaseConnections = 5

# Определяет, нужно ли проверять доступность соединений с базой данных.
# По умолчанию: False
TestDatabaseConnections = False


# ---------------------------------------------------------------------------
# Настройки автоматического резервного копирования базы данных
# ---------------------------------------------------------------------------
# Создавать резервные копии базы данных при перезапуске или выключении сервера.
BackupDatabase = False

# Путь к папке bin в MySQL. Необходим только для Windows.
MySqlBinLocation = C:/xampp/mysql/bin/

# Путь, по которому будут храниться резервные копии MySQL.
BackupPath = ../backup/

# Максимальное количество дней хранения резервных копий.
# Старые файлы в папке резервных копий будут удалены.
# Установите 0 для отключения.
BackupDays = 30
