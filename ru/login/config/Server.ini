# ---------------------------------------------------------------------------
# Настройки Login-сервера
# ---------------------------------------------------------------------------
# Это конфигурационный файл сервера. Здесь вы можете настроить параметры подключения для вашего сервера.
# Настройки подразумевают, что сервер находится за роутером.
# Упрощенные определения:
# LAN (локальная сеть) - обычно компьютеры, подключенные к тому же роутеру, что и вы.
# WAN (глобальная сеть) - обычно компьютеры ВНЕ вашего роутера (т.е. интернет).
# x.x.x.x - формат IP-адреса. Не включайте 'x' в настройки. Используйте реальные цифры.

# ---------------------------------------------------------------------------
# Сетевые настройки
# ---------------------------------------------------------------------------

# IP-адрес, на котором будет работать Login-сервер. Используйте 0.0.0.0 для привязки ко всем доступным IP.
# ВНИМАНИЕ: <u><b><font color="red">Пожалуйста, не меняйте IP по умолчанию, если не уверены в своих действиях!</font></b></u>
# ВНИМАНИЕ: <u><b><font color="red">Внешние/внутренние IP теперь настраиваются в файле "ipconfig.xml".</font></b></u>
# По умолчанию: 0.0.0.0
LoginserverHostname = 0.0.0.0

# Порт для подключения Login-сервера.
# По умолчанию: 2106
LoginserverPort = 2106

# Адрес, на котором Login-сервер ожидает подключения от Game-серверов. Используйте *, чтобы слушать все доступные IP.
# ВНИМАНИЕ: <u><b><font color="red">Пожалуйста, не меняйте IP по умолчанию, если не уверены в своих действиях!</font></b></u>
# ВНИМАНИЕ: <u><b><font color="red">Внешние/внутренние IP теперь настраиваются в файле "ipconfig.xml".</font></b></u>
# По умолчанию: 127.0.0.1
LoginHostname = 127.0.0.1

# Порт, на котором Login-сервер ожидает подключения от Game-серверов.
# По умолчанию: 9014
LoginPort = 9014


# ---------------------------------------------------------------------------
# Безопасность
# ---------------------------------------------------------------------------

# Количество попыток ввода неверного логина/пароля до автоматического бана IP.
# По умолчанию: 5
LoginTryBeforeBan = 5

# Время (в секундах), в течение которого IP будет заблокирован после превышения лимита попыток входа.
# По умолчанию: 900 (15 минут)
LoginBlockAfterBan = 900

# Если True, любой Game-сервер может зарегистрироваться на свободном слоте вашего Login-сервера.
# По умолчанию: True
AcceptNewGameServer = True

# Защита от флуда (DDoS). Все значения указаны в миллисекундах.
# По умолчанию: True
EnableFloodProtection = True

# Лимит быстрых соединений с одного IP.
# По умолчанию: 15
FastConnectionLimit = 15

# Время для нормального соединения (в миллисекундах).
# По умолчанию: 700
NormalConnectionTime = 700

# Время для быстрого соединения (в миллисекундах).
# По умолчанию: 350
FastConnectionTime = 350

# Максимальное количество соединений с одного IP-адреса.
# По умолчанию: 50
MaxConnectionPerIP = 50


# ---------------------------------------------------------------------------
# Различные настройки логин-сервера
# ---------------------------------------------------------------------------

# Если False, лицензионное соглашение (после ввода логина/пароля) не будет отображаться.
# По умолчанию: True
ShowLicence = True

# Включение автоматического создания игровых аккаунтов при первом входе.
# По умолчанию: True
AutoCreateAccounts = True

# Корневая директория датапака.
# По умолчанию: текущая директория, из которой запускается сервер.
DatapackRoot = .


# ---------------------------------------------------------------------------
# Плановая перезагрузка логин-сервера
# ---------------------------------------------------------------------------

# Включить или выключить плановую перезагрузку логин-сервера.
# По умолчанию: False
LoginRestartSchedule = False
# Время в часах.
# По умолчанию: 24
LoginRestartTime = 24
