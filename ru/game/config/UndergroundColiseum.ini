# ---------------------------------------------------------------------------
# Подземный Колизей
# ---------------------------------------------------------------------------

# Время начала битвы (в формате cron).
# По умолчанию: 21:00 каждую пятницу, субботу и воскресенье.
BattleStartTime = 0 21 * * 5,6,7

# Длительность периода битвы (в часах).
# По умолчанию: 2
BattlePeriod = 2

# Объявлять о начале и завершении события.
# По умолчанию: False
AllowAnnouncements = False

# Минимальный размер группы для регистрации.
# По умолчанию: 7
PartySize = 7

# Задержка перед воскрешением (в секундах).
# По умолчанию: 10
ResurrectionTime = 10
