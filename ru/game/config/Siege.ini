# ---------------------------------------------------------------------------
# Настройки осад
# ---------------------------------------------------------------------------
# Значения по умолчанию соответствуют официальным настройкам (Retail). Изменение этих параметров приведет к отклонению от механик оффа.
# Внимание:
# Будьте предельно осторожны при внесении изменений. Убедитесь, что вы понимаете, на что влияют эти настройки, прежде чем менять их на работающем сервере.

# ---------------------------------------------------------------------------
# Стандартные настройки
# ---------------------------------------------------------------------------

# Цикл осад (в неделях)
# По умолчанию: 2
SiegeCycle = 2

# Длительность осады до начала отсчета (в минутах).
# По умолчанию: 120
SiegeLength = 120

# Максимальное количество флагов на один клан.
# По умолчанию: 1
MaxFlags = 1

# Минимальный уровень клана для регистрации на осаду.
# По умолчанию: 5
SiegeClanMinLevel = 5

# Максимальное количество кланов, которые могут зарегистрироваться с каждой стороны (атакующие).
# По умолчанию: 500
AttackerMaxClans = 500

# Настройка максимального количества кланов, которые могут зарегистрироваться на стороне защитников.
# По умолчанию: 500
DefenderMaxClans = 500

# Время респауна (в миллисекундах).
# По умолчанию: 0
AttackerRespawn = 0

# Награда за успешную защиту замка в виде Blood Alliance (Кровь Альянса) в КВХ (Кланхолл/Клан-склад)
# По умолчанию: 1
BloodAllianceReward = 1


