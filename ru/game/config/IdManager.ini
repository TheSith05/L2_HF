# ---------------------------------------------------------------------------
# Настройки менеджера ID
# ---------------------------------------------------------------------------
# ВАЖНО: Эти настройки нельзя менять во время работы сервера.
# ---------------------------------------------------------------------------

# Включает очистку базы данных при запуске сервера для удаления устаревших или некорректных данных.
# Большая база данных может замедлить запуск, если очистка включена.
# Чтобы ускорить запуск, установите значение 'False'; однако регулярная очистка рекомендуется для оптимальной производительности.
# По умолчанию: True
DatabaseCleanUp = True

# Определяет начальный ID объекта в диапазоне выделяемых ID.
# Это значение вместе с LastObjectId определяет весь диапазон уникальных ID, которые могут быть выделены.
# Примечание: FirstObjectId должен быть меньше, чем LastObjectId.
# По умолчанию: 268,435,456 (0x10000000)
FirstObjectId = 268435456

# Определяет конечный ID объекта в диапазоне выделяемых ID.
# Максимальное значение (2,147,483,647 или 0x7FFFFFFF) гарантирует, что диапазон ID укладывается в лимиты стандартного 32-битного целого числа.
# По умолчанию: 2,147,483,647 (0x7FFFFFFF)
LastObjectId = 2147483647

# Определяет начальную емкость BitSet в количестве ID.
# Эта настройка указывает, сколько ID может отслеживать BitSet изначально, и может влиять на использование оперативной памяти.
# По умолчанию: 100000
InitialCapacity = 100000

# Устанавливает порог заполнения для запуска динамического изменения размера BitSet.
# Когда процент использованных ID достигает или превышает это значение, BitSet расширяется для размещения большего количества ID.
# Значение должно быть от 0 до 1 (например, 0.9 означает 90% использования).
# По умолчанию: 0.9
ResizeThreshold = 0.9

# Устанавливает коэффициент роста для изменения размера BitSet при достижении порога ResizeThreshold.
# Этот множитель определяет, насколько расширяется BitSet относительно его текущего размера.
# Например, значение 1.1 расширяет BitSet на 10% при каждом изменении размера.
# По умолчанию: 1.1
ResizeMultiplier = 1.1
