# ---------------------------------------------------------------------------
# Настройки игрового сервера
# ---------------------------------------------------------------------------
# Это файл конфигурации сервера. Здесь вы можете настроить параметры подключения для вашего сервера.
# Предполагается, что сервер находится за роутером.
# Простые определения:
# LAN (Локальная сеть) - обычно компьютеры, подключенные к тому же роутеру, что и вы.
# WAN (Глобальная сеть) - обычно компьютеры ВНЕ вашего роутера (т.е. интернет).
# x.x.x.x - Формат IP-адреса. Не включайте 'x' в настройки. Должны быть реальные числа.

# ---------------------------------------------------------------------------
# Сетевые настройки
# ---------------------------------------------------------------------------

# Адрес логин-сервера, к которому должен подключиться этот гейм-сервер
# ВНИМАНИЕ: <u><b><font color="red">Пожалуйста, не меняйте IP по умолчанию, если не уверены в своих действиях!</font></b></u>
# ВНИМАНИЕ: <u><b><font color="red">Внешние/Внутренние IP теперь настраиваются в файле "ipconfig.xml".</font></b></u>
# По умолчанию: 127.0.0.1
LoginHost = 127.0.0.1

# TCP-порт, который слушает логин-сервер для запросов на подключение от гейм-сервера
# По умолчанию: 9014
LoginPort = 9014

# IP-адрес для привязки гейм-сервера. В большинстве случаев менять не нужно.
# ВНИМАНИЕ: <u><b><font color="red">Пожалуйста, не меняйте IP по умолчанию, если не уверены в своих действиях!</font></b></u>
# ВНИМАНИЕ: <u><b><font color="red">Внешние/Внутренние IP теперь настраиваются в файле "ipconfig.xml".</font></b></u>
# По умолчанию: * (0.0.0.0)
GameserverHostname = 0.0.0.0

# Настройка порта для гейм-сервера
# По умолчанию: 7777
GameserverPort = 7777

# Шифрование пакетов.
# По умолчанию пакеты, отправляемые или получаемые, шифруются алгоритмом Blowfish.
# Отключение снижает нагрузку на процессор при обработке пакетов,
# также широковещательные пакеты не нужно перешифровывать для каждого клиента.
# По оффу (Retail): True
PacketEncryption = False


# ---------------------------------------------------------------------------
# Прочие настройки сервера
# ---------------------------------------------------------------------------

# ID сервера, который будет запрашивать гейм-сервер.
# Пример: 1 = Bartz
# По умолчанию: 1
RequestServerID = 1

# True = Логин-сервер выдаст другой ID серверу, если запрошенный ID уже занят.
# По умолчанию: True
AcceptAlternateID = True

# Корневая директория датапака.
# По умолчанию используется текущая директория, из которой запущен сервер, если строка ниже не раскомментирована.
# ВНИМАНИЕ: <u><b><font color="red">Если указанный путь неверный, это приведет к множеству ошибок!</font></b></u>
# По умолчанию: .
DatapackRoot = .

# Корневая директория скриптов.
ScriptRoot = ./data/scripts

# Максимальное количество игроков, которые могут одновременно находиться на сервере.
# По умолчанию: 2000
MaximumOnlineUsers = 2000

# Номера ревизий протокола, которые сервер разрешает для подключения.
# Разделитель: ;
# ВНИМАНИЕ: <u><b><font color="red">Изменение ревизии протокола может привести к несовместимости и множеству ошибок в игре!</font></b></u>
# По умолчанию: 267;268;271;273
AllowedProtocolRevisions = 267;268;271;273

# Отображает тип сервера рядом с его названием при выборе персонажа.
# Примечания:
#	Допустимые значения: Normal, Relax, Test, Broad, Restricted, Event, Free, World, New, Classic
# По умолчанию: Free
ServerListType = Free

# Отображает минимальный возрастной рейтинг сервера рядом с его названием при выборе персонажа.
# Примечания:
# Допустимые значения: 0, 15, 18
# По умолчанию: 0
ServerListAge = 0

# Настройка списка серверов.
# Отображает [] перед названием сервера при выборе персонажа.
# По умолчанию: False
ServerListBrackets = False


# ---------------------------------------------------------------------------
# Монитор взаимных блокировок (отдельный поток для обнаружения Deadlock).
# ---------------------------------------------------------------------------
# Для улучшения логов крашей и автоматического перезапуска сервера в случае Deadlock (если включено).
# Интервал проверки задается в секундах.
# По умолчанию: True
DeadlockWatcher = True

# Интервал проверки взаимных блокировок (Deadlock) в секундах.
# По умолчанию: 20
DeadlockCheckInterval = 20

# Автоматический перезапуск сервера при обнаружении взаимной блокировки (Deadlock).
# По умолчанию: False
RestartOnDeadlock = False


# ---------------------------------------------------------------------------
# Настройки HWID (Hardware ID) игроков
# ---------------------------------------------------------------------------

# Проверка получения информации об аппаратном обеспечении (HWID) при входе.
# ВНИМАНИЕ: Для получения HWID клиент игры должен быть модифицирован для отправки данных через метод setHardwareInfo.
# По умолчанию: False
EnableHardwareInfo = False

# Игроки без HWID будут кикнуты с сервера.
# Автоматически устанавливается в True, если MaxPlayersPerHWID > 0.
# По умолчанию: False
KickMissingHWID = False

# Максимальное количество окон (персонажей) с одного HWID, разрешенное для входа в игру.
# По умолчанию: 0 (без ограничений)
MaxPlayersPerHWID = 0

# Требовать свежий пакет HWID при каждом входе в мир, вместо использования ранее сохраненного значения.
# Решает проблему, когда клиент, отправивший HWID один раз, перестает его слать и не кикается системой.
# Эффективно только при включенном KickMissingHWID = True.
# По умолчанию: False
RequireFreshHWID = False

# Задержка в миллисекундах перед проверкой HWID после входа в мир (время, даваемое клиенту на отправку пакета).
# Увеличьте значение, если легитимных игроков кикает при включенном RequireFreshHWID на слабых ПК.
# По умолчанию: 5000
HwidCheckDelay = 5000


# ---------------------------------------------------------------------------
# Прочие настройки игроков
# ---------------------------------------------------------------------------

# Шаблон (регулярное выражение) для имен персонажей.
# Примеры:
# CnameTemplate = [A-Z][a-z]{3,3}[A-Za-z0-9]*
# Позволяет имена с заглавной буквы, тремя строчными и любыми символами/цифрами, например: OmfgWTF1
# CnameTemplate = [A-Z][a-z]*
# Позволяет имена только из букв с заглавной первой, например: Omfgwtf
# По умолчанию: .* (разрешает любые символы)
CnameTemplate = .*

# Ограничение имен, которые игроки могут давать своим питомцам.
# Подробности см. в описании CnameTemplate.
PetNameTemplate = .*

# Ограничение имен кланов и подразделений (академия/гвардии), которые могут создавать игроки.
# Подробности см. в описании CnameTemplate.
ClanNameTemplate = .*

# Максимальное количество персонажей на аккаунте.
# По умолчанию: 7 (лимит клиента)
CharMaxNumber = 7


# ---------------------------------------------------------------------------
# Превентивный перезапуск сервера
# ---------------------------------------------------------------------------

# Включить перезапуск сервера при критической нагрузке на CPU или память.
# По умолчанию: False
PrecautionaryRestartEnabled = False

# Включить мониторинг нагрузки на процессор (CPU).
# По умолчанию: True
PrecautionaryRestartCpu = True

# Включить мониторинг использования оперативной памяти процессом сервера.
# По умолчанию: False
PrecautionaryRestartMemory = False

# Проверять, идут ли осады, находятся ли игроки на Олимпиаде, в ивентах, инстансах
# или держат в таргете рейд-боссов.
# По умолчанию: True
PrecautionaryRestartChecks = True

# Процент использования ресурсов, при котором сработает триггер.
# По умолчанию: 95
PrecautionaryRestartPercentage = 95

# Задержка в секундах между проверками ресурсов.
# По умолчанию: 60
PrecautionaryRestartDelay = 60


# ---------------------------------------------------------------------------
# Плановый перезапуск сервера
# ---------------------------------------------------------------------------

# Включить плановый перезапуск сервера по расписанию.
# По умолчанию: False
ServerRestartScheduleEnabled = False

# Отправлять уведомление игроку при входе в игру.
# По умолчанию: False
ServerRestartScheduleMessage = False

# Обратный отсчет времени до рестарта (в секундах).
# По умолчанию: 600 (10 минут)
ServerRestartScheduleCountdown = 600

# Время для планового рестарта.
# Можно указать несколько значений через запятую (,).
# Пример: 12:00, 00:00
ServerRestartSchedule = 08:00

# Укажите дни недели, в которые будет происходить рестарт. Значения через запятую (,).
# Пример: 1,2,3,4,5,6,7 (ВОСКРЕСЕНЬЕ, ПОНЕДЕЛЬНИК, ВТОРНИК, СРЕДА, ЧЕТВЕРГ, ПЯТНИЦА, СУББОТА)
# По умолчанию: 4 (СРЕДА)
ServerRestartDays = 4
