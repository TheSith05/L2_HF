# ---------------------------------------------------------------------------
# Настройки авто-потов (Auto Potion)
# ---------------------------------------------------------------------------
# Используйте команды .apon / .apoff или .potionon / .potionoff для включения/выключения.

# Включить команды для авто-потов.
AutoPotionsEnabled = false

# Использовать авто-поты на Олимпиаде.
AutoPotionsInOlympiad = false

# Минимальный уровень персонажа для использования команд.
AutoPotionMinimumLevel = 1

# Включить авто-использование банок CP.
AutoCpEnabled = true
# Процент CP, при котором будут использоваться банки.
AutoCpPercentage = 70
# ID предметов для авто-CP (5592 - Greater CP Potion, 5591 - CP Potion). Указывать в порядке приоритета использования.
AutoCpItemIds = 5592,5591

# Включить авто-использование банок HP.
AutoHpEnabled = true
# Процент HP, при котором будут использоваться банки.
AutoHpPercentage = 70
# ID предметов для авто-HP (1540 - Greater Healing Potion, 1539 - Healing Potion, 1061 - Lesser Healing Potion, 1060 - Healing Potion). Указывать в порядке приоритета использования.
AutoHpItemIds = 1540,1539,1061,1060

# Включить авто-использование банок MP.
AutoMpEnabled = true
# Процент MP, при котором будут использоваться банки.
AutoMpPercentage = 70
# ID предметов для авто-MP (728 - Greater Mana Potion). Указывать в порядке приоритета использования.
AutoMpItemIds = 728
