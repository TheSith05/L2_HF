# ---------------------------------------------------------------------------
# Фейковые игроки (боты)
# ---------------------------------------------------------------------------
# Наша система фейковых игроков использует существующую систему NPC, позволяя им функционировать как обычные NPC с минимальным влиянием на производительность сервера.

# Включить фейковых игроков.
# По умолчанию: False
EnableFakePlayers = False

# Разрешить чат с фейковыми игроками.
# По умолчанию: True
FakePlayerChat = True

# Разрешить фейковым игрокам использовать соски (Soulshots/Spiritshots).
# По умолчанию: True
FakePlayerUseShots = True

# Начислять PvP-очки за убийство фейковых игроков.
# По умолчанию: True
FakePlayerKillsRewardPvP = True

# Применять правила кармы при убийстве фейковых игроков.
# По умолчанию: True
FakePlayerUnflaggedKillsKarma = True

# Фейковых игроков можно атаковать без получения флага PvP.
# По умолчанию: False
FakePlayerAutoAttackable = False

# Агрессивные фейковые игроки атакуют ближайших монстров.
# По умолчанию: True
FakePlayerAggroMonsters = True

# Агрессивные фейковые игроки атакуют ближайших реальных игроков.
# По умолчанию: False
FakePlayerAggroPlayers = False

# Агрессивные фейковые игроки атакуют других фейковых игроков.
# По умолчанию: False
FakePlayerAggroFPC = False

# Фейковые игроки могут дропать (выбивать) предметы при убийстве монстров.
# По умолчанию: True
FakePlayerCanDropItems = True

# Фейковые игроки могут подбирать выпавшие предметы.
# По умолчанию: True
FakePlayerCanPickup = True
