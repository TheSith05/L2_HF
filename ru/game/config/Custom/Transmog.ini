# ---------------------------------------------------------------------------
# Система Трансмогрификации (смена внешнего вида)
# ---------------------------------------------------------------------------
# Трансмогрификация позволяет заменить внешний вид вашей брони и оружия на вид других предметов.
# Любой полученный вами предмет добавляется в коллекцию трансмогрификации.
# Вы можете воспользоваться этой системой через NPC Zumzi (900009).

# Включить/выключить систему трансмогрификации.
TransmogEnabled = False

# Сделать коллекцию трансмогрификации общей для всех персонажей на одном аккаунте.
TransmogShareAccount = False

# Стоимость применения трансмогрификации в Адене (57 - Адена).
TransmogApplyCost = 0

# Стоимость удаления трансмогрификации в Адене (57 - Адена).
TransmogRemoveCost = 0

# Список ID предметов, которые нельзя добавить в трансмогрификацию, через запятую.
TransmogBannedItemIds = 
