# ---------------------------------------------------------------------------
# Система Премиум-аккаунтов (VIP)
# ---------------------------------------------------------------------------
# -Администраторы могут управлять подписками через основное админ-меню.
# -Игроки могут использовать команду .premium для просмотра информации об аккаунте.
# -Внимание: Премиум-рейты умножают текущие рейты сервера.

# ---------------------------------------------------------------------------
# PC Cafe (PC Bang / Очки компьютерного клуба)
# ---------------------------------------------------------------------------
# Необходимо добавить в l2.ini в секцию [Localize] параметр UsePCBangPoint=true
# ID очков PC CAFE = -100

# Включение системы премиум-аккаунтов.
# По умолчанию: False
EnablePremiumSystem = False

# Распространять действие премиума на весь аккаунт (на всех персонажей).
# По умолчанию: True
AccountWidePremium = True

# Включение системы очков PC Cafe.
PcCafeEnabled = False

# Получение очков PC Cafe как на официальном сервере (10 очков начисляются каждые 5 минут онлайна).
PcCafeRetailLike = True

# Время для начисления очков PC Cafe (в миллисекундах).
# По оффу (Retail): 300000 (5 минут).
PcCafeRewardTime = 300000

# Разрешить накопление очков только игрокам с активным Премиум-аккаунтом.
PcCafeOnlyPremium = True

# Максимальное количество очков PC Cafe, которое может иметь игрок.
# Ограничено лимитом типа данных int.
MaxPcCafePoints = 200000

# Количество очков PC Cafe, получаемых при включенном режиме как на оффе.
AcquisitionPointsRetailLikePoints = 10

# Рейт получения очков PC Cafe, если режим как на оффе отключен.
# Формула получения: (exp * 0.0001 * AcquisitionPointsRate)
# Например, при 1.0: 10000 опыта = 1 очко PC Bang
# 2.0 - 10000 опыта = 2 очка PC Bang
# 0.5 - 5000 опыта = 1 очко PC Bang
AcquisitionPointsRate = 1.0

# Использовать случайное количество очков при награждении.
# Если включено, количество очков будет варьироваться от (points/2) до (points).
AcquisitionPointsRandom = False

# Включает шанс получения двойных очков.
DoublingAcquisitionPoints = True

# Шанс получения двойных очков (в процентах).
# Используется, если включена опция DoublingAcquisitionPoints.
# По умолчанию: 1 (%)
DoublingAcquisitionPointsChance = 1

# Награждать очками за убийства, дающие мало опыта.
# Начислять очки, если игрок получает опыт, а результат формулы равен 0.
RewardLowExpKills = True

# Шанс получения награды за убийство мобов с низким опытом
# Используется, когда включена опция RewardLowExpKills.
# По умолчанию: 50 (%)
RewardLowExpKillsChance = 50

# Рейт опыта (XP) для игроков с премиум-аккаунтом.
PremiumRateXp = 2

# Рейт очков умений (SP) для игроков с премиум-аккаунтом.
PremiumRateSp = 2

# Рейт шанса дропа предметов для игроков с премиум-аккаунтом.
PremiumRateDropChance = 1

# Рейт количества выпадаемых предметов для игроков с премиум-аккаунтом.
PremiumRateDropAmount = 2

# Рейт шанса спойла (42 - Sweeper) для игроков с премиум-аккаунтом.
PremiumRateSpoilChance = 1

# Рейт количества спойла (42 - Sweeper) для игроков с премиум-аккаунтом.
PremiumRateSpoilAmount = 2

# Рейт опыта (XP) за квесты для игроков с премиум-аккаунтом.
PremiumRateQuestXp = 1

# Рейт очков умений (SP) за квесты для игроков с премиум-аккаунтом.
PremiumRateQuestSp = 1

# Внимание: Рейты премиума не влияют на рейд-боссов и травы (herbs), но указанные ниже предметы могут иметь свои множители.
# Список предметов, на которые влияют кастомные рейты дропа; также используется для настройки рейта Адены (57 - Адена).
# Формат: itemId1,multiplier1;itemId2,multiplier2;...
PremiumRateDropChanceByItemId = 57,2;6656,1;6657,1;6658,1;6659,1;6660,1;6661,1;6662,1;8191,1;10170,1;10314,1
PremiumRateDropAmountByItemId = 57,2;6656,1;6657,1;6658,1;6659,1;6660,1;6661,1;6662,1;8191,1;10170,1;10314,1
