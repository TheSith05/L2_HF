# ---------------------------------------------------------------------------
# Настройка системы возврата баффов
# ---------------------------------------------------------------------------
# Восстановление баффов после их снятия (кенсела) при соблюдении определенных условий.

# Глобальный переключатель функции возврата баффов.
# Если False, баффы не будут восстанавливаться ни при каких обстоятельствах.
# По умолчанию: False
CancelReturn = False

# Восстанавливать бафф, если его наложил монстр или Рейд Босс.
# По умолчанию: True
ReturnMonster = True

# Восстанавливать бафф, если его наложил другой игрок.
# По умолчанию: True
ReturnPlayer = True

# Восстанавливать баффы для игроков, участвующих в Олимпиаде.
# Эта настройка работает только при включенном ReturnPlayer = True.
# По умолчанию: False
ReturnPlayerOlys = False

# Задержка (в секундах) перед автоматическим восстановлением снятого баффа.
# Применяется только при выполнении условий для возврата баффа.
# По умолчанию: 10
TimeToReturn = 10
