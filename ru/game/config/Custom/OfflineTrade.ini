# ---------------------------------------------------------------------------
# Настройки оффлайн торговли и крафта
# ---------------------------------------------------------------------------

# Включение или отключение функции оффлайн торговли.
OfflineTradeEnable = True

# Включение или отключение функции оффлайн крафта.
OfflineCraftEnable = True

# Если True, оффлайн магазины можно будет ставить только в мирных зонах (Peace Zones).
OfflineModeInPeaceZone = True

# Если True, персонажи в режиме оффлайн торговли будут неуязвимы к урону, их нельзя будет убить.
OfflineModeNoDamage = True

# Если True, цвет имени персонажа будет меняться при переходе в оффлайн режим.
OfflineSetNameColor = True

# Цвет имени в оффлайн режиме (если OfflineSetNameColor = True).
OfflineNameColor = 808080

# Начислять очки славы (Fame) персонажам в оффлайн режиме.
OfflineFame = True

# Восстанавливать оффлайн торговцев после рестарта или выключения сервера.
RestoreOffliners = True

# Не восстанавливать оффлайн персонажей, если прошло больше дней, чем указано в OfflineMaxDays.
# Требуется рестарт сервера для отключения просроченных магазинов.
# 0 = отключено (всегда восстанавливать).
OfflineMaxDays = 0

# Отключать (выкидывать) торговца после завершения продажи или покупки.
OfflineDisconnectFinished = True

# Отключать оффлайн торговца, если персонаж с того же аккаунта заходит в игру.
OfflineDisconnectSameAccount = False

# Сохранять транзакции оффлайн торговцев в реальном времени.
# Потребляет больше ресурсов базы данных, но помогает сохранить данные при внезапном падении сервера.
StoreOfflineTradeInRealtime = True

# Включить команду .offline для выхода из игры в режим оффлайн торговли.
EnableOfflineCommand = True

# Аномальный эффект (визуальный эффект) для оффлайн торговцев.
# Можно указать несколько эффектов через запятую для случайного выбора.
# Оставьте пустым для отключения.
# Пример: SLEEP
OfflineAbnormalEffect = 
