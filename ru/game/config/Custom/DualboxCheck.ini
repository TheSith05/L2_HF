# ---------------------------------------------------------------------------
# Настройки ограничения количества окон (Dualbox)
# ---------------------------------------------------------------------------

# Максимальное количество персонажей с одного IP-адреса, которые могут одновременно находиться в игре.
# По умолчанию: 0 (без ограничений)
DualboxCheckMaxPlayersPerIP = 0

# Максимальное количество персонажей с одного IP-адреса, которые могут участвовать в Олимпиаде.
# По умолчанию: 0 (без ограничений)
DualboxCheckMaxOlympiadParticipantsPerIP = 0

# Максимальное количество персонажей с одного IP-адреса, которые могут участвовать в ивентах через движок L2J Event Engine (команда //event).
# По умолчанию: 0 (без ограничений)
DualboxCheckMaxL2EventParticipantsPerIP = 0

# Максимальное количество персонажей с одного IP-адреса, которые могут находиться в режиме оффлайн-торговли/крафта.
# По умолчанию: 0 (без ограничений)
DualboxCheckMaxOfflinePlayPerIP = 0

# Максимальное количество премиум-персонажей с одного IP-адреса, которые могут находиться в режиме оффлайн-торговли/крафта.
# По умолчанию: 0 (без ограничений)
DualboxCheckMaxOfflinePlayPremiumPerIP = 0

# Учитывать ли оффлайн-трейдеров при проверке лимита окон.
# По умолчанию: False
DualboxCountOfflineTraders = False

# Белый список IP-адресов для проверки лимита окон.
# Формат: Адрес1,Число1;Адрес2,Число2...
# Сетевой адрес может быть в числовом (127.0.0.1) или символьном (localhost) формате.
# Дополнительное число соединений прибавляется к глобальным лимитам для этого адреса.
# Например, если лимит участников ивента TvT на IP равен 1 (без окон), а в белом списке указано "l2jmobius.org,2",
# то общее количество разрешенных участников с этого адреса будет 1+2=3. Используйте 0 или отрицательное значение для снятия ограничений.
# По умолчанию: 127.0.0.1,0 (без ограничений для localhost)
DualboxCheckWhitelist = 127.0.0.1,0
