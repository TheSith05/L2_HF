# ---------------------------------------------------------------------------
# Чемпионы - превращение обычных мобов в усиленных чемпионов
# ---------------------------------------------------------------------------

# Включение/выключение системы мобов-чемпионов.
ChampionEnable = False

# Сделать всех чемпионов пассивными?
# Чтобы оставить их агрессивными (по умолчанию), установите False.
# Чтобы сделать всех чемпионов пассивными, установите True.
ChampionPassive = False

# Шанс в % того, что моб станет чемпионом (0 для отключения).
ChampionFrequency = 5

# Титул для всех мобов-чемпионов.
ChampionTitle = Champion

# Отображение красной ауры у мобов-чемпионов.
ChampionAura = True

# Минимальный и максимальный уровень моба, при котором он может стать чемпионом.
ChampionMinLevel = 20
ChampionMaxLevel = 70

# Множитель HP для мобов-чемпионов.
ChampionHp = 8

# Множитель регенерации HP для мобов-чемпионов.
ChampionHpRegen = 1.0

# Множитель получаемого опыта (Exp) и очков умений (Sp) с чемпионов.
ChampionRewardsExpSp = 8.0

# Множитель шанса выпадения стандартных предметов с чемпионов.
ChampionRewardsChance = 8.0

# Множитель количества выпадаемых стандартных предметов с чемпионов.
ChampionRewardsAmount = 1.0

# Множитель шанса выпадения Адены и Печатей (Seal Stones) с чемпионов.
ChampionAdenasRewardsChance = 1.0

# Множитель количества выпадаемой Адены и Печатей (Seal Stones) с чемпионов.
ChampionAdenasRewardsAmount = 1.0

# Бонус к Физ. атаке (P. Atk) и Маг. атаке (M. Atk) для мобов-чемпионов.
ChampionAtk = 1.0

# Бонус к скорости физической и магической атаки для мобов-чемпионов.
ChampionSpdAtk = 1.0

# ID и количество предметов, которые получит игрок в качестве награды за убийство чемпиона.
# Разделяются через ;
# Пример: 6393,1 (6393 - Giant's Codex);57,5000 (57 - Адена, 5000 штук)
ChampionRewardItems = 6393,1

# Шанс в % получения награды за убийство чемпиона, уровень которого ниже уровня игрока.
# По умолчанию: 0
ChampionRewardLowerLvlItemChance = 0

# Шанс в % получения награды за убийство чемпиона, уровень которого выше уровня игрока.
# По умолчанию: 0
ChampionRewardHigherLvlItemChance = 100

# Включить расчет Виталити (Vitality) при убийстве мобов-чемпионов?
# Внимание: это может привести к сильному дисбалансу на сервере, так как рейты будут рассчитываться как: "опыт моба x рейты сервера x бонус Виталити x бонус опыта чемпиона".
# Примечание:
# Работает только если EnableVitality = True
# По умолчанию: False
ChampionEnableVitality = False

# Разрешить появление мобов-чемпионов внутри инстанс-зон.
# По умолчанию: False
ChampionEnableInInstances = False
