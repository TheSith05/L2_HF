# ---------------------------------------------------------------------------
# Общие настройки сервера
# ---------------------------------------------------------------------------
# Настройки по умолчанию приближены к официальным (Retail). Изменение этих параметров приведет к отклонению от механик оффа.
# Внимание:
# Будьте предельно осторожны при внесении правок. Убедитесь, что вы понимаете, на что влияет настройка, прежде чем менять её на работающем сервере.

# ---------------------------------------------------------------------------
# Администратор
# ---------------------------------------------------------------------------

# Если установлено True, каждый новый персонаж будет иметь уровень доступа 127. Это означает, что любой созданный персонаж получит права Администратора.
# По умолчанию: False
EverybodyHasAdminRights = False


# Если True, только аккаунты с правами ГМа смогут зайти на сервер.
# По умолчанию: False
ServerGMOnly = False

# Включить отображение ауры Героя у ГМов при входе в игру.
# Примечания:
#	ГМы могут использовать команду "///hero" на себе, чтобы получить эту ауру добровольно.
#	Рекомендуется держать выключенным из-за возможных графических лагов.
# По умолчанию: False
GMHeroAura = False

# Входить ли ГМу в игру в режиме невидимости (Builder Hide) по умолчанию.
# По умолчанию: True
GMStartupBuilderHide = True

# Автоматически включать режим неуязвимости (Invulnerable) для ГМа при входе в игру.
# По умолчанию: False
GMStartupInvulnerable = True

# Автоматически включать режим невидимости (Invisible) для ГМа при входе в игру.
# По умолчанию: False
GMStartupInvisible = True

# Автоматически блокировать личные сообщения (ПМ) для ГМа при входе в игру.
# По умолчанию: False
GMStartupSilence = False

# Автоматически отображать ГМа в списке администраторов (/gmlist) при входе в игру.
# По умолчанию: False
GMStartupAutoList = False

# Автоматически включать режим диеты (Diet Mode) для ГМа при входе в игру (отменяет штраф веса).
# По умолчанию: False
GMStartupDietMode = False

# Применять ли ограничения на использование предметов к ГМам? (True = ограничения действуют)
# По умолчанию: True
GMItemRestriction = True

# Применять ли ограничения на использование скиллов к ГМам? (True = ограничения действуют)
# По умолчанию: True
GMSkillRestriction = True

# Разрешить ГМам выбрасывать/передавать непередаваемые предметы и квестовые предметы (только дроп).
# По умолчанию: False
GMTradeRestrictedItems = False

# Разрешить ГМам делать рестарт или выходить из игры, находясь в боевой стойке.
# По умолчанию: True
GMRestartFighting = True

# Отображать имя ГМа после сделанного им объявления
# Пример: "Announce: hi (HanWik)"
GMShowAnnouncerName = False

# Отображать имя ГМа перед сделанным им объявлением
# Пример: "Nyaran: hi"
GMShowCritAnnouncerName = False

# Выдавать специальные скиллы каждому ГМу
# 7029 (Hero Berserker), 7041-7064, 7088-7096, 23238-23249 (Master's Blessing - Благословение Мастера)
# По умолчанию: False
GMGiveSpecialSkills = False

# Выдавать специальные аура-скиллы каждому ГМу
# 7029 (Hero Berserker), 23238-23249, 23253-23296 (Master's Blessing - Благословение Мастера)
# По умолчанию: False
GMGiveSpecialAuraSkills = False

# Отладка путей к HTML-файлам для персонажей с правами ГМа.
# По умолчанию: True
GMDebugHtmlPaths = True

# Если вас не устраивает реализация команды //gmspeed как на оффе,
# с помощью этой настройки вы можете вернуть старую кастомную версию скорости ГМа от L2J.
# По умолчанию: False
UseSuperHasteAsGMSpeed = False


# ---------------------------------------------------------------------------
# Безопасность сервера
# ---------------------------------------------------------------------------

# Настройки логирования. Включение этих параметров значительно увеличит объем логов, записываемых на диск.
# Это может привести к повышенному использованию дискового пространства и, в зависимости от нагрузки на сервер и активности игроков, повлиять на производительность.
# Используйте эти опции осторожно, исходя из ваших потребностей в логировании и мощностей сервера.

# Включить логирование чата игроков. Установите True, если вам нужен архив всех сообщений в чате.
# По умолчанию: False
LogChat = False

# Включить логирование операций с предметами (например, поднятие, обмен, продажа).
# Эта настройка полезна для отслеживания перемещения предметов, но может привести к созданию огромных логов на серверах с высоким онлайном.
# По умолчанию: False
LogItems = False

# Если включено LogItems, установите True, чтобы логировать только важные предметы, а именно Адену (57 - игровая валюта) и экипируемые предметы.
# Это помогает уменьшить объем логов за счет исключения обычного мусора.
# По умолчанию: False
LogItemsSmallLog = False

# Если включено LogItems, установите True, чтобы логировать только определенные ID предметов вместо всех подряд.
# Полезно, если вам нужно отслеживать только редкие или ценные предметы.
# По умолчанию: False
LogItemsIdsOnly = False

# Указывает ID предметов для логирования, если включена опция LogItemsIdsOnly.
# Вводите ID предметов через запятую для отслеживания конкретных вещей.
# По умолчанию: 4356 (Золото Эйнхасад)
LogItemsIdsList = 4356

# Включить логирование всех действий, связанных с заточкой предметов (успех или неудача).
# Помогает отслеживать подозрительную активность, но может создать огромные файлы логов при массовой заточке.
# По умолчанию: False
LogItemEnchants = False

# Включить логирование всех действий, связанных с заточкой скиллов (улучшение и модификация).
# Полезно для мониторинга прогресса скиллов, но может привести к избыточному логированию на активных серверах.
# По умолчанию: False
LogSkillEnchants = False

# Включить аудит (логирование) действий, совершаемых Гейм-Мастерами (ГМ).
# Это помогает отслеживать активность ГМ для обеспечения контроля административных действий.
# По умолчанию: False
GMAudit = False

# Проверка персонажей на наличие запрещенных скиллов.
# По умолчанию: False
SkillCheckEnable = True

# Если True, удалять невалидные скиллы у персонажа и из базы данных.
# Если False, только логировать (отчет).
# По умолчанию: False
SkillCheckRemove = True

# Проверять также персонажей с правами ГМ (работает только если SkillCheckEnable = True).
# По умолчанию: True
SkillCheckGM = False


# ---------------------------------------------------------------------------
# Оптимизация
# ---------------------------------------------------------------------------

# Управление предметами на земле.
# Разрешить игрокам выбрасывать предметы на землю.
# По умолчанию: True
AllowDiscardItem = True

# Удалять выброшенные предметы с земли через указанное количество секунд. 0 — отключено.
# По умолчанию: 600
AutoDestroyDroppedItemAfter = 600

# Время в секундах, через которое выпавшие хербы (травы) будут автоматически удалены.
# По умолчанию: 60
AutoDestroyHerbTime = 60

# Список ID предметов, которые не будут удаляться (через запятую, например: 57,5575,6673).
# Примечания:
#	Убедитесь, что в списке НЕТ пробелов между числами!
#	Предметы из этого списка будут защищены от удаления независимо от других настроек.
#	57 - Адена, 5575 - Знак Клана, 6673 - Кристалл Атрибута.
# По умолчанию: 0
ListOfProtectedItems = 0

# Интервал (в минутах), с которым сервер обновляет информацию о персонаже (например, координаты).
# Чем выше значение, тем реже сохранение данных, что снижает нагрузку на БД и жесткий диск.
# Чем ниже значение, тем чаще сохранение, что увеличивает нагрузку на БД и жесткий диск.
# Значение 0 отключает периодическое сохранение.
# Независимо от этой настройки, персонаж всегда сохраняется при выходе из игры.
# По умолчанию: 15
CharacterDataStoreInterval = 15

# Позволяет серверу обновлять инвентарь персонажа только в момент его сохранения.
# Включение этой опции значительно снижает нагрузку на БД и повышает производительность.
# ВНИМАНИЕ: Эта опция приводит к потере предметов при краше сервера.
# По умолчанию: False
LazyItemsUpdate = False

# Если включено, принудительно обновляет предметы персонажа в БД при его сохранении (даже если включен LazyItemsUpdate).
# По умолчанию: True
UpdateItemsOnCharStore = True

# Удалять с земли также прочие предметы, выброшенные игроками (все, кроме экипировки).
# Примечание:
#	Работает только если AutoDestroyDroppedItemAfter > 0.
# По умолчанию: False
DestroyPlayerDroppedItem = False

# Удалять выброшенную экипировку (броня, оружие, бижутерия).
# Примечание:
#	Работает только если DestroyPlayerDroppedItem = True.
# По умолчанию: False
DestroyEquipableItem = False

# Сделать все предметы выбрасываемыми/удаляемыми.
# Если включено, игроки смогут выбросить любой предмет!!!
DestroyAllItems = False

# Сохранять выброшенные предметы в базу данных для восстановления после рестарта сервера.
# По умолчанию: False
SaveDroppedItem = False

# Включить/выключить очистку таблицы выброшенных предметов после их загрузки в память (настройка безопасности).
# Если сервер упал до сохранения, при следующем запуске старые предметы восстановятся, и если игроки успели их подобрать, это предотвратит дубликаты.
# По умолчанию: False
EmptyDroppedItemTableAfterLoad = False

# Интервал в минутах для сохранения выброшенных на землю предметов в БД. 0 — отключено.
# Примечания:
# Если интервал отключен, предметы сохраняются в БД только при выключении сервера.
# По умолчанию: 60
SaveDroppedItemInterval = 60

# Удалять все сохраненные предметы из БД при следующем рестарте?
# Примечания:
# Работает только если SaveDroppedItem = False.
# По умолчанию: False
ClearDroppedItemTable = False

# Удалять некорректные квестовые данные у персонажей.
# По умолчанию: False
AutoDeleteInvalidQuestData = False

# Разрешить создание нескольких нестекуемых предметов одновременно?
# По умолчанию: True
MultipleItemDrop = True

# Включить/выключить кэширование HTML-файлов.
# True = Загружать все HTML в кэш при старте сервера.
# False = Загружать HTML в кэш только при первом обращении.
# Рекомендуется для лайв-серверов: True
# Рекомендуется для разработки: False
HtmCache = False

# Проверять HTML-файлы на наличие не-ASCII символов.
# По умолчанию: True
CheckHtmlEncoding = True

# Минимальное и максимальное время в секундах для задержки анимации NPC.
# MinNpcAnimation должно быть меньше или равно MaxNpcAnimation.
# Установите 0 для отключения случайных анимаций.
# По умолчанию: 5
MinNpcAnimation = 5
# Максимальное время в секундах для задержки анимации NPC.
# По умолчанию: 60
MaxNpcAnimation = 60
# Минимальное время в секундах для задержки анимации монстров.
# По умолчанию: 5
MinMonsterAnimation = 5
# Максимальное время в секундах для задержки анимации монстров.
# По умолчанию: 60
MaxMonsterAnimation = 60

# Настройки сетки (Grid): сетки могут включаться и выключаться автоматически. Это влияет на загрузку и обработку AI-задач и геодаты в пределах сетки.
# Включение сетки при появлении игрока происходит мгновенно, затем включаются 8 соседних сеток через указанное время.
# Выключение сетки происходит, если в ней и соседних сетках в течение указанного времени не было игроков.
# Опция AlwaysOn игнорирует это и держит все сетки активными постоянно (не рекомендуется).
# По умолчанию: False
GridsAlwaysOn = False

# Время в секундах для включения соседних сеток.
# По умолчанию: 1
GridNeighborTurnOnTime = 1

# Время в секундах для выключения соседних сеток.
# По умолчанию: 90
GridNeighborTurnOffTime = 90

# Корректировка цен в байлистах и мультиселлах, если они ниже цены продажи.
# По умолчанию: True
CorrectPrices = True

# Лимит количества предметов в одной транзакции мультиселла.
# Максимально допустимое клиентом значение: 999999
MultisellAmountLimit = 10000


# ---------------------------------------------------------------------------
# Урон от падения
# ---------------------------------------------------------------------------

# Разрешить персонажам получать урон при падении с высоты.
# По умолчанию: True
EnableFallingDamage = True


# ---------------------------------------------------------------------------
# Скиллы и эффекты
# ---------------------------------------------------------------------------

# Влияние резистов персонажа на длительность дебаффов.
# Если опция выключена, длительность дебаффа будет соответствовать значению в XML-файле скилла.
DebuffDurationUsesResists = True


# ---------------------------------------------------------------------------
# Дополнительные функции
# ---------------------------------------------------------------------------

# Режимы мирных зон (Peace Zone):
# 0 = Всегда мирная зона
# 1 = ПвП разрешено во время осады для участников осады
# 2 = ПвП разрешено всегда
# По умолчанию: 0
PeaceZoneMode = 0

# Настройка глобального чата.
# Доступные опции: ON, OFF, GM, GLOBAL
# По умолчанию: ON
GlobalChat = ON

# Настройка торгового чата.
# Доступные опции: ON, OFF, GM, GLOBAL
# По умолчанию: ON
TradeChat = ON

# Минимальный уровень персонажа для использования чата, 0 = отключено.
MinimumChatLevel = 0

# Если у вас возникают проблемы с транзакциями на складе (Warehouse), вы можете отключить их здесь.
# По умолчанию: True
AllowWarehouse = True

# Настройка функции возврата предметов (Refund) у NPC.
# По умолчанию: True
AllowRefund = True

# Настройка системы внутриигровой почты.
# По умолчанию: True
AllowMail = True

# Настройка возможности прикреплять предметы к письмам.
# По умолчанию: True
AllowAttachments = True

# Если True, игроки могут примерять оружие и броню в магазине.
# По умолчанию: True
AllowWear = True

# Задержка перед повторной примеркой предмета в секундах.
# По умолчанию: 5
WearDelay = 5

# Стоимость примерки предмета в Адене (57 - Адена).
# По умолчанию: 10
WearPrice = 10


# ---------------------------------------------------------------------------
# Инстанс-зоны
# ---------------------------------------------------------------------------
# Восстанавливает игрока в его предыдущий инстанс (например, подземелье) при входе в игру.
# По умолчанию: False
RestorePlayerInstance = True

# Определяет, можно ли использовать скиллы призыва (Summon) для телепортации игроков внутрь инстанса.
# Если включено, призыв может быть дополнительно запрещен в XML-файлах конкретных инстансов.
# По умолчанию: False
AllowSummonInInstance = False

# Время в секундах, через которое мертвый игрок будет автоматически удален из инстанса.
# По умолчанию: 60
EjectDeadPlayerTime = 60

# Время в секундах до закрытия инстанса после его завершения.
# По умолчанию: 300
DefaultFinishTime = 300


# ---------------------------------------------------------------------------
# Разные настройки
# ---------------------------------------------------------------------------

# Разрешить использование системы скачек (Race).
# По умолчанию: True
AllowRace = True

# Разрешить передвижение в воде.
# По умолчанию: True
AllowWater = True

# Разрешить аренду питомцев (Виверна и Страйдер) у Pet Manager.
# По умолчанию: False
AllowRentPet = False

# Разрешить рыбалку.
# По умолчанию: True
AllowFishing = True

# Разрешить использование кораблей.
# По умолчанию: True
AllowBoat = True

# Радиус оповещения о прибытии корабля.
# Если игроки жалуются на спам сообщений о кораблях, радиус можно уменьшить.
# По умолчанию: 20000
BoatBroadcastRadius = 20000

# Разрешить использование проклятого оружия (8190 - Зарич, 8689 - Акаманаф).
# По умолчанию: True
AllowCursedWeapons = True

# Если false, блокирует возможность находиться в пати во время ивента.
# Если true, разрешает пати, если оба игрока участвуют в одном и том же ивенте.
AllowPartyInSameEvent = True

# Показывать "data/html/servnews.htm" при входе персонажа в игру.
# По умолчанию: False
ShowServerNews = False

# Включить Комьюнити Борд (Alt+B).
# По умолчанию: True
EnableCommunityBoard = True

# Стартовая страница Комьюнити Борда.
# По умолчанию: _bbshome
BBSDefault = _bbshome

# Включить фильтр чата (цензуру).
# По умолчанию: False
UseChatFilter = False

# Символы, которыми будут заменяться запрещенные слова в чате.
ChatFilterChars = ^_^

# Каналы чата, на которые распространяется бан чата (разделитель ";").
# GENERAL (белый чат)
# SHOUT (крик !)
# WHISPER (приват ")
# PARTY (пати #)
# CLAN (клан @)
# GM (админ-чат //gmchat)
# PETITION_PLAYER (петиция игрока *)
# PETITION_GM (петиция ГМа *)
# TRADE (торговый чат +)
# ALLIANCE (альянс $)
# ANNOUNCEMENT (анонс)
# BOAT (чат корабля)
# FRIEND (друзья)
# MSNCHAT (MSN чат)
# PARTYMATCH_ROOM (комната поиска пати)
# PARTYROOM_COMMANDER (желтый чат командного канала)
# PARTYROOM_ALL (красный чат командного канала)
# HERO_VOICE (геройский чат %)
# CRITICAL_ANNOUNCE (критический анонс)
# SCREEN_ANNOUNCE (анонс на весь экран)
# BATTLEFIELD (чат поля боя)
# MPCC_ROOM (комната командного канала)
# NPC_GENERAL (обычный чат NPC)
# NPC_SHOUT (крик NPC)
# По умолчанию: GENERAL;SHOUT;TRADE;HERO_VOICE;WHISPER
BanChatChannels = GENERAL;SHOUT;TRADE;HERO_VOICE;WHISPER


# ---------------------------------------------------------------------------
# Настройки системы Манора (Manor)
# ---------------------------------------------------------------------------

# Включение системы Манора на сервере.
# По умолчанию: True
AllowManor = True

# Время обновления Манора в 24-часовом формате.
# По умолчанию: 20 (20:00)
AltManorRefreshTime = 20

# Минуты обновления Манора.
# По умолчанию: 00 (начало часа)
AltManorRefreshMin = 00

# Время подтверждения периода Манора в 24-часовом формате.
# По умолчанию: 4 (04:00)
AltManorApproveTime = 4

# Минуты подтверждения периода Манора.
