# ---------------------------------------------------------------------------
# Настройки осады фортов
# ---------------------------------------------------------------------------
# Значения по умолчанию соответствуют официальному серверу (Retail). Изменение этих параметров приведет к отклонению от механик оффа.
# Внимание:
# Будьте крайне осторожны при внесении изменений. Убедитесь, что вы понимаете суть настройки, прежде чем менять её на рабочем сервере.

# ---------------------------------------------------------------------------
# Стандартные настройки
# ---------------------------------------------------------------------------

# Длительность осады до начала обратного отсчета (в минутах).
SiegeLength = 60

# Время ожидания до респауна Подозрительного Торговца (Suspicious Merchant) после окончания осады (в минутах).
# Помните: как только торговец появляется, форт снова становится доступным для осады.
# По умолчанию: 180
SuspiciousMerchantRespawnDelay = 180

# Время, отведенное на убийство всех командиров после смерти первого из них (в минутах).
# Если по истечении этого времени командиры не будут убиты, все командиры и двери форта респаунятся.
CountDownLength = 10

# Максимальное количество флагов на один клан.
MaxFlags = 1

# Минимальный уровень клана для регистрации на осаду.
SiegeClanMinLevel = 4

# Максимальное количество кланов, которые могут зарегистрироваться с каждой стороны.
AttackerMaxClans = 500

# Если включено, позволяет регистрироваться на осаду форта только владельцам замков, находящихся на той же территории.
# По умолчанию: True
JustToTerritory = True

# ---------------------------------------------------------------------------
# Спавн командиров форта
# ---------------------------------------------------------------------------
# Синтаксис командира: NameCommanderN = x,y,z,heading,npc_id
# Name - название форта
# N - номер:
#            - 1: Командир лучников (Archer Commander)
#            - 2: Командир стражи (Guard Commander)
#            - 3: Командир поддержки (Support Unit Commander)
#            - 4: Главная машина (Main Machine) - пока не поддерживается, используется General
#            - 5: Генерал (General) - пока не используется, будет задействован при поддержке комнаты управления
# Пожалуйста, соблюдайте порядок командиров, иначе клиент будет некорректно отображать захваченные бараки.
# Комната управления (main machine) в данный момент эмулируется клиентом.
# x,y,z - координаты
# heading - направление взгляда
# npc_id - ID шаблона NPC

# Синтаксис флага: NameFlagN = x,y,z,flag_id
# Name - название форта
# N - номер
# x,y,z - координаты
# flag_id - ID боевого флага (9819 - Combat Flag)

