# ---------------------------------------------------------------------------
# Настройки Территориальных Войн (Territory War)
# ---------------------------------------------------------------------------
# Значения по умолчанию соответствуют оффу (Retail). Любые изменения приведут к отклонению от официальной механики.
# Внимание:
# Будьте предельно осторожны при изменении настроек. Убедитесь, что вы понимаете последствия, прежде чем применять их на живом сервере.

# ---------------------------------------------------------------------------
# Стандартные настройки
# ---------------------------------------------------------------------------

# Длительность осады до начала обратного отсчета (в минутах).
# По умолчанию: 120
WarLength = 120

# Минимальный уровень клана для регистрации на ТВ.
# По умолчанию: 0
ClanMinLevel = 0

# Минимальный уровень персонажа для регистрации на ТВ.
# По умолчанию: 40
PlayerMinLevel = 40

# Максимальное количество кланов, которые могут зарегистрироваться за одну сторону.
# По умолчанию: 500
DefenderMaxClans = 500

# Максимальное количество игроков, которые могут зарегистрироваться за одну сторону.
# По умолчанию: 500
DefenderMaxPlayers = 500

# Можно ли атаковать и убить игрока с флагом (Ward) в мирной зоне (Peace Zone).
# По умолчанию: False
PlayerWithWardCanBeKilledInPeaceZone = False

# Спавнить ли флаги (Wards) в замках, когда Территориальные Войны не идут.
# По умолчанию: False
SpawnWardsWhenTWIsNotInProgress = False

# Возвращать ли все флаги (Wards) в их родные замки при начале Территориальных Войн.
# По умолчанию: False
# True: Исправляет проблему, когда флаги не спавнятся при старте ТВ.
ReturnWardsWhenTWStarts = True

# Количество значков территории (Territory Badge), необходимое для получения статуса Дворянина (Noblesse).
# По умолчанию: 100
MinTerritoryBadgeForNobless = 100

# Количество значков территории (Territory Badge), необходимое для покупки Страйдера (Strider).
# По умолчанию: 50
MinTerritoryBadgeForStriders = 50

# Количество значков территории (Territory Badge), необходимое для покупки Страйдера Стража (Guardian's Strider).
# По умолчанию: 80
MinTerritoryBadgeForBigStrider = 80