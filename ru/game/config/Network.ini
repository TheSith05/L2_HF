# ---------------------------------------------------------------------------------------------------------------------------------
# Сетевые настройки
# Эти параметры обеспечивают детальный контроль над поведением сети и обработкой пакетов внутри серверного приложения.
# Настройка этих параметров помогает оптимизировать производительность сети и обеспечить безопасную связь между сервером и клиентами.
# ---------------------------------------------------------------------------------------------------------------------------------


# ---------------------------------------------------------------------------------------------------------------------------------
# Общие настройки сети
# ---------------------------------------------------------------------------------------------------------------------------------

# Время ожидания при выключении
# Определяет время в секундах, которое сервер ждет завершения отправки/получения пакетов при выключении.
# По умолчанию: 5 секунд
ShutdownWaitTime = 5

# Настройка отбрасывания пакетов
# Определяет, включено ли отбрасывание пакетов.
# По умолчанию: True
DropPackets = True

# Порог отбрасывания пакетов
# Определяет порог для отбрасывания одноразовых пакетов. Более высокие значения позволяют ставить в очередь больше пакетов до начала отбрасывания, что потенциально снижает потерю пакетов ценой большего потребления памяти.
# По умолчанию: 250
DropPacketThreshold = 2500


# ---------------------------------------------------------------------------------------------------------------------------------
# Настройки пула потоков (ThreadPool)
# ---------------------------------------------------------------------------------------------------------------------------------

# Определяет размер основного пула потоков для обработки пакетов.
# Определяет количество потоков, которые будут предварительно запущены и доступны для немедленной обработки задач.
# Если установлено 0, размер по умолчанию равен количеству доступных ядер процессора.
# Большее число позволяет обрабатывать больше задач одновременно, меньшее — экономит ресурсы.
# По умолчанию: 0 (автоматически устанавливается как количество доступных ядер процессора * 4)
ThreadPoolSize = 0

# Определяет уровень приоритета потоков в пуле обработки пакетов.
# Это значение определяет важность данных потоков относительно других процессов в системе.
# Значения обычно варьируются от 1 (низший приоритет) до 10 (высший приоритет).
# По умолчанию: 5 (средний уровень приоритета, подходящий для общей обработки задач)
ThreadPriority = 5


# ---------------------------------------------------------------------------------------------------------------------------------
# Настройки пула буферов
# ---------------------------------------------------------------------------------------------------------------------------------

# Начальный коэффициент, размер и размер буфера для малых, средних и больших пулов буферов.
# Эти пулы оптимизируют использование памяти за счет повторного использования стандартных размеров буферов.

# Размер сегмента буфера
# Размер сегментов для динамических буферов, которые используются для увеличения размера буферов по мере необходимости.
# По умолчанию: 64
BufferSegmentSize = 64

# Разрешить пулу буферов динамически увеличивать свой размер при достижении максимальной емкости.
# По умолчанию: True
BufferPool.AutoExpandCapacity = True

# Начальный коэффициент
# Множитель для предварительной инициализации пулов буферов. Более высокий коэффициент означает, что создается больше буферов заранее.
# По умолчанию: 0 (без предварительной инициализации)
BufferPool.InitFactor = 0

# Пул пустых буферов
# Размер и объем буфера для пустых пакетов. Используется для сетевых пакетов нулевого размера.
# По умолчанию: 100 буферов по 2 байта каждый.
BufferPool.Empty.Size = 100
BufferPool.Empty.BufferSize = 2

# Пул минимальных буферов
# Размер и объем буфера для минимальных пакетов. Используется для сетевых пакетов минимального размера.
# По умолчанию: 100 буферов по 64 байта каждый.
BufferPool.Minimum.Size = 100
BufferPool.Minimum.BufferSize = 64

# Пул очень маленьких буферов
# Размер и объем буфера для очень маленьких пакетов. Используется для передачи минимальных сетевых пакетов.
# По умолчанию: 75 буферов по 128 байт каждый.
BufferPool.VerySmall.Size = 75
BufferPool.VerySmall.BufferSize = 128

# Пул маленьких буферов
# Размер и объем буфера для маленьких пакетов. Используется для передачи небольших сетевых пакетов.
# По умолчанию: 75 буферов по 256 байт каждый.
BufferPool.Small.Size = 75
BufferPool.Small.BufferSize = 256

# Пул увеличенных маленьких буферов
# Размер и объем буфера для пакетов чуть большего размера. Используется для передачи соответствующих сетевых пакетов.
# По умолчанию: 75 буферов по 512 байт каждый.
BufferPool.LargeSmall.Size = 75
BufferPool.LargeSmall.BufferSize = 512

# Пул малых средних буферов
# Размер и объем буфера для малых средних пакетов. Используется для передачи сетевых пакетов среднего размера.
# По умолчанию: 50 буферов по 1024 байта каждый.
BufferPool.SmallMedium.Size = 50
BufferPool.SmallMedium.BufferSize = 1024

# Пул средних буферов
# Размер и объем буфера для средних пакетов. Используется для передачи стандартных сетевых пакетов.
# По умолчанию: 50 буферов по 2048 байт каждый.
BufferPool.Medium.Size = 50
BufferPool.Medium.BufferSize = 2048

# Пул увеличенных средних буферов
# Размер и объем буфера для пакетов чуть больше среднего. Используется для передачи соответствующих сетевых пакетов.
# По умолчанию: 50 буферов по 4096 байт каждый.
BufferPool.LargeMedium.Size = 50
BufferPool.LargeMedium.BufferSize = 4096

# Пул малых больших буферов
# Размер и объем буфера для малых больших пакетов. Используется для передачи сетевых пакетов увеличенного размера.
# По умолчанию: 25 буферов по 8192 байта каждый.
BufferPool.SmallLarge.Size = 25
BufferPool.SmallLarge.BufferSize = 8192

# Пул больших буферов
# Размер и объем буфера для больших пакетов. Используется для передачи крупных сетевых пакетов.
# По умолчанию: 25 буферов по 16384 байта.
BufferPool.Large.Size = 25
BufferPool.Large.BufferSize = 16384

# Пул очень больших буферов
# Размер и объем буфера для очень больших пакетов. Используется для передачи объемных сетевых пакетов.
# По умолчанию: 25 буферов по 24576 байт каждый.
BufferPool.VeryLarge.Size = 25
BufferPool.VeryLarge.BufferSize = 24576

# Пул максимальных буферов
# Размер и объем буфера для пакетов максимального размера. Используется для передачи самых тяжелых сетевых пакетов.
# По умолчанию: 10 буферов по 32768 байт.
BufferPool.Maximum.Size = 10
BufferPool.Maximum.BufferSize = 32768
