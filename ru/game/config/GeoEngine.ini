# =================================================================
# Настройки геодаты
# =================================================================

# Настройки поиска пути (Pathfinding):
# 0 = Отключено
# 1 = Включено с использованием файлов path node.
# 2 = Включено с использованием ячеек геодаты в реальном времени (рекомендуется).
# По умолчанию: 2
PathFinding = 2

# Путь к директории с файлами геодаты.
GeoDataPath = ./data/geodata/

# Путь к директории с файлами pathnode.
# По умолчанию: pathnode
PathnodePath = ./data/pathnode/

# Директория для сохранения изменений геодаты.
# Можно установить ./data/geodata/ для перезаписи существующих файлов при сохранении.
GeoEditPath = ./saves/

# Конфигурация буферов массива поиска пути.
PathFindBuffers = 100x6;128x6;192x6;256x4;320x4;384x4;500x2

# Вес для узлов без препятствий, находящихся далеко от стен.
LowWeight = 0.5

# Вес для узлов, расположенных рядом со стенами.
MediumWeight = 2

# Вес для узлов, содержащих препятствия.
HighWeight = 3

# Улучшенная стратегия диагонального движения. Пути будут более "умными", но это увеличит нагрузку на CPU.
AdvancedDiagonalStrategy = False

# Избегать построения путей через узлы, которые заблокированы в любом направлении.
AvoidObstructedPathNodes = True

# Вес для диагонального движения. Используется только при AdvancedDiagonalStrategy = True
# По умолчанию: LowWeight * sqrt(2)
DiagonalWeight = 0.707

# Максимальное количество проходов постфильтра LOS (Line of Sight - проверка видимости), 0 отключает постфильтр.
# По умолчанию: 3
MaxPostfilterPasses = 3
