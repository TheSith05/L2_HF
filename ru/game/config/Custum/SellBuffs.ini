# ---------------------------------------------------------------------------
# Настройки продажи баффов
# ---------------------------------------------------------------------------
# Команда: .sellbuff или .sellbuffs

# Включить/выключить систему продажи баффов
SellBuffEnable = False

# Множитель затрат маны (MP) на наложение баффов
MpCostMultipler = 1

# ID предмета для оплаты в системе продажи баффов, можно изменить на кастомную серверную монету
# По умолчанию: 57 (Адена)
PaymentID = 57

# Минимальная цена за каждый бафф
MinimumPrice = 100000

# Максимальная цена за каждый бафф
MaximumPrice = 100000000

# Максимальное количество баффов в списке продажи
MaxBuffs = 20
