# ---------------------------------------------------------------------------
# Настройки NPC для мгновенного получения статуса Дворянина (Nobless)
# ---------------------------------------------------------------------------

# Общие настройки
# ---------------------------------------------------------------------------

# Включение или отключение NPC Дворянина.
# По умолчанию: False
Enabled = False

# Настройки NPC
# ---------------------------------------------------------------------------

# ID NPC, который выдает статус Дворянина.
# По умолчанию: 1003000
NpcId = 1003000

# Требуемый уровень для получения статуса Дворянина.
# Примечание: Если вы измените это значение, убедитесь, что соответствующие HTML-файлы обновлены.
# По умолчанию: 80
LevelRequirement = 80

# Требования к предметам
# ---------------------------------------------------------------------------

# ID предмета, требуемого для получения статуса Дворянина.
# По умолчанию: 57 (Адена)
ItemId = 57

# Количество требуемого предмета.
# Установите 0, чтобы отключить требование предмета.
# По умолчанию: 0
ItemCount = 0

# Настройки наград
# ---------------------------------------------------------------------------

# Выдавать ли Тиару Дворянина (Nobless Tiara) при получении статуса.
# По умолчанию: True
RewardTiara = True
