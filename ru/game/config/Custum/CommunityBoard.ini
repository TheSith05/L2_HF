# Стоимость понижения уровня.
# По умолчанию: 0 (бесплатно)
CommunityDelevelPrice = 0

# Разрешить использование Community Board только в мирной зоне.
# По умолчанию: False
CommunityBoardPeaceOnly = False

# Запретить использование Community Board во время боя.
# По умолчанию: True
CommunityCombatDisabled = True

# Запретить использование Community Board для игроков с кармой (ПК).
# По умолчанию: True
CommunityKarmaDisabled = True

# Отображение анимации каста для каждого баффа.
# По умолчанию: False
CommunityCastAnimations = False

# Включить покупку премиум-аккаунта через Комьюнити Борд (Alt+B).
