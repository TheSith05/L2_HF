# ---------------------------------------------------------------------------
# Настройки кастомной Community Board (Альт+Б)
# ---------------------------------------------------------------------------

# Включить кастомную Community Board.
# По умолчанию: False
CustomCommunityBoard = False

# Валюта, используемая в Community Board (ID предмета).
# По умолчанию: 57 (Адена)
CommunityCurrencyId = 57

# Включить мультиселлы (обмен предметов).
# По умолчанию: True
CommunityEnableMultisells = True

# Включить телепорты.
# По умолчанию: True
CommunityEnableTeleports = True

# Включить баффы.
# По умолчанию: True
CommunityEnableBuffs = True

# Включить восстановление HP/MP/CP.
# По умолчанию: True
CommunityEnableHeal = True

# Включить возможность понижения уровня персонажа.
# По умолчанию: False
CommunityEnableDelevel = False

# Стоимость телепортов.
# По умолчанию: 0 (бесплатно)
