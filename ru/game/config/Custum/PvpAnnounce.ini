# ---------------------------------------------------------------------------
# Настройки анонсов ПвП и ПК
# ---------------------------------------------------------------------------

# Включение анонсов убийств в ПвП и ПК
# По умолчанию: False
AnnouncePkPvP = False

# Выводить анонс как обычное системное сообщение
# По умолчанию: True
AnnouncePkPvPNormalMessage = True

# Шаблон сообщения при ПК
# Переменные: $killer (убийца), $target (жертва)
AnnouncePkMsg = $killer has slaughtered $target

# Шаблон сообщения при ПвП
# Переменные: $killer (убийца), $target (жертва)
AnnouncePvpMsg = $killer has defeated $target
