# ---------------------------------------------------------------------------
# Система свадеб
# ---------------------------------------------------------------------------
#
# ID NPC Свадебного менеджера: 50007
#
# Часть первая - "Помолвка"
# 1) Возьмите в таргет игрока, с которым хотите создать пару.
# 2) Используйте команду .engage имя_партнера и нажмите Enter.
# 3) Если игрок добавлен у вас в друзья (вы есть друг у друга в списке друзей), появится запрос на помолвку и системное сообщение.
# 4) Если игрок принимает приглашение, вы становитесь помолвлены.
#
# Часть вторая - "Брак"
# 1) После помолвки игроки могут обратиться к NPC Andromeda (Свадебный жрец) в Hot Springs (Годдард).
#    (Вам могут понадобиться Formal Wear (Свадебный наряд) и Адена для оплаты услуг!)
# 2) Каждый игрок должен поговорить с NPC и подтвердить желание вступить в брак.
# 3) После этого запустятся фейерверки, и игроки будут официально женаты.
#
# После свадьбы вы можете использовать команду .gotolove имя_партнера для телепортации к супругу (может взиматься плата, указанная ниже).
#
# Для отмены помолвки/развода используйте команду .divorce имя_партнера.
#
# Если вы женаты, вы должны выплачивать определенный % своей адены партнеру.
#
# Если женатый игрок пытается помолвиться с кем-то еще, он может получить штраф (если включено ниже).
# ---------------------------------------------------------------------------
# Включить/выключить систему свадеб
AllowWedding = False

# Количество Адены, необходимое для проведения свадьбы
WeddingPrice = 250000000

# Включить/выключить наказание для игроков, которые пытаются помолвиться с другими, будучи уже в браке.
WeddingPunishInfidelity = True

# Включить/выключить функцию телепортации для супругов.
WeddingTeleport = True

# Количество Адены, необходимое для телепортации к супругу.
WeddingTeleportPrice = 50000

# Время в секундах до телепортации персонажа после использования скилла.
WeddingTeleportDuration = 60

# Включить/выключить однополые браки.
WeddingAllowSameSex = False

# Требовать ли от игроков наличие Formal Wear (Свадебный наряд) для заключения брака?
WeddingFormalWear = True

# Процент (%) от Адены, который игрок должен выплатить другому при разводе.
WeddingDivorceCosts = 20
