# ---------------------------------------------------------------------------
# Настройки многоязычности
# ---------------------------------------------------------------------------

# Включение или отключение поддержки нескольких языков на сервере.
# По умолчанию: False
MultiLangEnable = False

# Язык по умолчанию, если клиентский язык не определен.
# По умолчанию: en
MultiLangDefault = en

# Список разрешенных языков, разделенных точкой с запятой.
# По умолчанию: en;el
MultiLangAllowed = en;el

# Включение или отключение использования команды .lang для смены языка «на лету».
# По умолчанию: True
MultiLangVoiceCommand = True
