# ---------------------------------------------------------------------------
# Система банковских операций (обмен адены на золотые слитки)
# ---------------------------------------------------------------------------

# Включить/выключить банковскую систему
BankingEnabled = False

# Количество золотых слитков, которое получает игрок при использовании команды .deposit. Также это количество, которое он теряет при использовании .withdraw.
BankingGoldbarCount = 1

# Количество адены (57 - Адена), которое получает игрок при использовании команды .withdraw. Также это количество, которое он теряет при использовании .deposit.
BankingAdenaCount = 1000000000

# Включить/выключить автоконвертацию.
# Автоматически конвертирует адену в золотые слитки, если в инвентаре адены больше, чем указано в лимите BankingAutoConvertAdenaLimit ниже.
BankingAutoConvert = False

# Лимит адены, после достижения которого срабатывает автоконвертация.
# По умолчанию: 51 миллиард
BankingAutoConvertAdenaLimit = 51000000000
