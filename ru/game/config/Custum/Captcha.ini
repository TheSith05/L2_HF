# ---------------------------------------------------------------------------
# Капча - защита от ботов
# ---------------------------------------------------------------------------

# Включить систему защиты от ботов.
EnableCaptcha = False

# Сколько монстров нужно убить для запуска проверки на бота?
KillCounter = 100

# Укажите диапазон случайных значений, которые прибавляются к основному счетчику убийств.
KillCounterRandomization = 50

# Сбрасывать счетчик убийств при бездействии игрока.
KillCounterReset = False

# Время в минутах после последнего убийства моба, по истечении которого счетчик сбрасывается.
KillCounterResetTime = 20

# Время в секундах, отведенное игроку на ввод капчи.
ValidationTime = 60

# Количество попыток ввода капчи для игрока.
# 1 = отключить.
CaptchaAttempts = 2

# Типы наказаний:
# 0 = телепорт персонажа в ближайшую деревню.
# 1 = кик персонажа с сервера.
# 2 = отправка персонажа в тюрьму.
# 3 = бан персонажа на сервере.
Punishment = 0

# Время пребывания в тюрьме (в минутах).
# 0 = пожизненное заключение.
JailTime = 2

# Удваивать время заключения при каждом повторном попадании в тюрьму.
# Через 24 часа время сбрасывается до начального значения.
DoubleJailTime = False
