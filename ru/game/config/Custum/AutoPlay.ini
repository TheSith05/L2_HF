# ---------------------------------------------------------------------------
# Настройки автоохоты (Auto Play)
# ---------------------------------------------------------------------------

# Включить использование команды .play для запуска автоохоты.
# По умолчанию: False
EnableAutoPlay = False

# Включить автоматическое использование зелий (Auto Potion) в режиме автоохоты.
# По умолчанию: True
EnableAutoPotion = True

# Включить автоматическое использование скиллов в режиме автоохоты.
# По умолчанию: True
EnableAutoSkill = True

# Включить автоматическое использование предметов в режиме автоохоты.
# По умолчанию: True
EnableAutoItem = True

# Возобновлять автоохоту автоматически при входе в игру.
# По оффу (Retail): False
ResumeAutoPlay = False

# Помощь лидеру группы (ассист).
# Если персонаж в пати, он будет брать в таргет цель лидера группы.
# По оффу (Retail): False
AssistLeader = False

# Радиус поиска целей для автоохоты.
# По умолчанию: ShortRange 600
# По умолчанию: LongRange 1400
ShortRange = 600
LongRange = 1400

# Разрешить использование команды .play только для игроков с премиум-аккаунтом.
# Система премиума должна быть включена.
# По умолчанию: False
AutoPlayPremium = False

# Список ID скиллов, которые нельзя добавить в меню автоохоты (через запятую).
# 42 - Sweeper (Спойл трупа)
DisabledSkillIds = 42

# Список ID предметов, которые нельзя добавить в меню автоохоты (через запятую).
DisabledItemIds = 

# Список предметов, которые игнорируются автоподбором (лутом).
# Проклятое оружие: 8190 - Зарич (Zariche), 8689 - Акаманахи (Akamanah)
IgnoredAutoPickItems = 8190, 8689

# Сообщение, отправляемое игрокам при входе в игру.
# Оставьте пустым, чтобы отключить.
# Пример: Вы можете использовать .play для автоматизации фарма.
AutoPlayLoginMessage = 
