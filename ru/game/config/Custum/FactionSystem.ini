# ---------------------------------------------------------------------------
# Система фракций (Добро против Зла)
# ---------------------------------------------------------------------------

# Включение системы фракций.
# По умолчанию: False
EnableFactionSystem = False

# Стартовая локация для всех игроков.
# По умолчанию: 85332,16199,-1252
StartingLocation = 85332,16199,-1252

# Точка спавна NPC менеджера фракций.
# По умолчанию: 85712,15974,-1260,26808
ManagerSpawnLocation = 85712,15974,-1260,26808

# Координаты базы фракции Добра.
# По умолчанию: 45306,48878,-3058
GoodBaseLocation = 45306,48878,-3058

# Координаты базы фракции Зла.
# По умолчанию: -44037,-113283,-237
EvilBaseLocation = -44037,-113283,-237

# Название команды Добра.
# По умолчанию: Good
GoodTeamName = Good

# Название команды Зла.
# По умолчанию: Evil
EvilTeamName = Evil

# Цвет ника для фракции Добра.
# По умолчанию: 00FF00
GoodNameColor = 00FF00

# Цвет ника для фракции Зла.
# По умолчанию: 0000FF
EvilNameColor = 0000FF

# Включение охраны фракций.
# У NPC должен быть прописан клан фракции в шаблоне.
# По умолчанию: True
EnableFactionGuards = True

# При смерти возрождение на базе фракции.
# По умолчанию: True
RespawnAtFactionBase = True

# При выборе фракции игрок автоматически получает статус Дворянина (Noblesse).
# По умолчанию: False
FactionAutoNobless = False

# Запретить чат между игроками разных фракций.
# По умолчанию: True
EnableFactionChat = True

# Запретить вход в игру, если в одной из фракций уже больше онлайн-игроков.
# По умолчанию: True
BalanceOnlinePlayers = True

# Лимит онлайна игроков для активации балансировщика.
# По умолчанию: 20
BalancePlayerExceedLimit = 20
