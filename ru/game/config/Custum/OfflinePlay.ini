# ---------------------------------------------------------------------------
# Настройки оффлайн автоохоты
# ---------------------------------------------------------------------------

# Разрешить использование команды .offlineplay для выхода из игры с продолжением автоохоты.
# По умолчанию: False
EnableOfflinePlayCommand = False

# Сохранять игроков в оффлайн-режиме в базе данных.
# Позволяет восстановить оффлайн-персонажей после рестарта сервера.
# По умолчанию: True
RestoreAutoPlayOffliners = True

# Разрешить использование команды .offlineplay только для премиум-игроков.
# Премиум-система должна быть включена.
# По умолчанию: False
OfflinePlayPremium = False

# Выбрасывать игрока из игры при смерти персонажа.
# По умолчанию: True
OfflinePlayLogoutOnDeath = True

# Отключать оффлайн-персонажа, если на этот же аккаунт заходит другой игрок.
OfflinePlayDisconnectSameAccount = False

# Сообщение, отправляемое игрокам при входе в игру.
# Оставьте пустым, чтобы отключить.
# Пример: Вы можете использовать .offlineplay, чтобы выйти из игры и продолжить автоохоту.
OfflinePlayLoginMessage = 

# Если True, цвет имени персонажа будет изменен при переходе в режим оффлайн-автоохоты.
# По умолчанию: True
OfflinePlaySetNameColor = True

# Цвет имени в режиме оффлайн-автоохоты (если OfflinePlaySetNameColor = True).
# По умолчанию: 808080
OfflinePlayNameColor = 808080

# Аномальный эффект (визуальный статус) для оффлайн-режима.
# Можно использовать несколько значений через запятую для выбора случайного эффекта.
# Оставьте пустым, чтобы отключить.
# Пример: SLEEP
OfflinePlayAbnormalEffect = 
