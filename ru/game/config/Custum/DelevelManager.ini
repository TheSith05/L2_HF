# ---------------------------------------------------------------------------
# Настройки NPC для мгновенного понижения уровня (Delevel Manager)
# ---------------------------------------------------------------------------

# Включить NPC для понижения уровня.
# По умолчанию: False
Enabled = False

# ID NPC для понижения уровня.
# По умолчанию: 1002000
NpcId = 1002000

# ID предмета, требуемого для оплаты услуги.
# По умолчанию: 4356 (Золото Эйнхасад)
RequiredItemId = 4356

# Количество требуемых предметов.
# По умолчанию: 2
RequiredItemCount = 2

# Минимальный уровень, до которого можно понизить персонажа.
# По умолчанию: 20
MimimumDelevel = 20
