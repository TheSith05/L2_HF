# ---------------------------------------------------------------------------
# Система перерождений (Rebirth)
# ---------------------------------------------------------------------------
# Этот модуль включает систему прогрессии перерождений для игроков.
#
# Основной функционал:
# - Позволяет персонажу совершить перерождение по достижении заданного уровня.
# - Поддерживает ограничение количества перерождений на персонажа.
# - Выдает настраиваемые награды после каждого успешного перерождения.
# - Позволяет игрокам изучать ограниченное количество скиллов перерождения.
# - Опционально может удалять большинство изученных скиллов при перерождении, сохраняя при этом защищенные группы скиллов и белый список.
# - Опционально может восстанавливать временные скиллы после очистки.
# - Опционально может применять скиллы перерождения на саб-классы.
#
# Порядок работы:
# 1. Игрок достигает минимально необходимого уровня.
# 2. Система проверяет стоимость и лимиты перерождений.
# 3. Процесс перерождения выполняется.
# 4. Применяется очистка/восстановление скиллов в зависимости от настроек.
# 5. Выдается награда, визуальные эффекты, личное сообщение и глобальное объявление.
#
# Важные примечания:
# - RebirthDeleteAllSkills — чувствительная настройка, включайте только после тщательной проверки защищенных групп и белого списка.
# - Поддерживаемые защищенные группы для этой хроники: STARTING_CLASS, FISHING, NOBLE, HERO, CLAN, COLLECT, SUBCLASS, SUBPLEDGE, TRANSFER и TRANSFORM.
# - Доступность скиллов, награды, стоимость и настройки вещания полностью настраиваются ниже.
# ---------------------------------------------------------------------------

# Включает или отключает систему перерождений.
RebirthAllow = false

# Минимальный уровень персонажа, необходимый для запроса перерождения.
RebirthMin = 75

# Максимальное количество перерождений, которое может совершить игрок.
RebirthMaxCount = 3

# Максимальное количество скиллов перерождения, которыми игрок может владеть одновременно.
RebirthMaxSelectedSkills = 3

# ---------------------------------------------------------------------------
# Наследование скиллов перерождения / Очистка скиллов
# ---------------------------------------------------------------------------

# Если True, скиллы перерождения также применяются к саб-классам.
# Если False, скиллы перерождения применяются только к основному классу.
RebirthInheritSkillsToSubclasses = true

# Если True, все скиллы игрока удаляются при перерождении, за исключением защищенных групп и скиллов из белого списка.
# Используйте с осторожностью.
RebirthDeleteAllSkills = true

# Список ID скиллов через запятую, которые никогда не должны удаляться при перерождении.
# Пример: 1216,1405,1414
RebirthSkillDeleteWhitelist =

# Группы скиллов, защищенные от удаления при перерождении.
# Доступные группы в High Five: STARTING_CLASS, FISHING, NOBLE, HERO, CLAN, COLLECT, SUBCLASS, SUBPLEDGE, TRANSFER, TRANSFORM
RebirthDeleteProtectedSkillGroups = STARTING_CLASS,FISHING,NOBLE,HERO,CLAN,COLLECT,SUBCLASS,SUBPLEDGE,TRANSFER,TRANSFORM

# Если True, временные скиллы восстанавливаются после фазы очистки/пересборки.
RebirthDeleteRestoreTemporarySkills = true

# ---------------------------------------------------------------------------
# Стоимость перерождения
# ---------------------------------------------------------------------------

# ID предмета и количество, требуемое для совершения перерождения (57 - Адена).
RebirthItemId = 57
RebirthItemAmount = 1000000

# ---------------------------------------------------------------------------
# Награда за перерождение
# ---------------------------------------------------------------------------

# Награда, выдаваемая после каждого успешного перерождения (1232 - Gold Einhasad).
RebirthRewardItemId = 1232
RebirthRewardItemAmount = 10

# ---------------------------------------------------------------------------
# Настройки сброса скиллов перерождения (Rebirth)
# ---------------------------------------------------------------------------

# Режим возврата ресурсов при сбросе скилла перерождения.
# Доступные опции: FULL (полный возврат), MID (частичный), NONE (без возврата)
RebirthSkillRefundMode = MID

# ---------------------------------------------------------------------------
# Наборы скиллов для системы перерождения
# ---------------------------------------------------------------------------

# Список доступных скиллов перерождения для магических классов.
# Формат: id_скилла,уровень,стоимость_в_предметах
RebirthMageSkills = 1059,1,6;1085,1,6;1204,1,6;1087,1,6;1013,1,6;1303,1,6

# Список доступных скиллов перерождения для воинов.
# Формат: id_скилла,уровень,стоимость_в_предметах
RebirthFighterSkills = 1086,1,6;1077,1,6;1013,1,6;1240,1,6;1035,1,6;1068,1,6

# ---------------------------------------------------------------------------
# Эффекты при завершении процесса перерождения
# ---------------------------------------------------------------------------

# Анимация, проигрываемая при успешном завершении перерождения.
# Формат: id социальной анимации
RebirthFinishSocialId = 7
RebirthFinishEffectSkillId = 2024
RebirthFinishEffectSkillLevel = 1

# Анимация, проигрываемая при изучении скилла перерождения.
# Формат: id социальной анимации
RebirthSelectSocialId = 3
RebirthSelectEffectSkillId = 2024
RebirthSelectEffectSkillLevel = 1

# ---------------------------------------------------------------------------
# Настройки личного сообщения на экране игрока
# ---------------------------------------------------------------------------

# Сообщение на экране, которое видит только игрок после успешного перерождения.
# Доступные переменные: %player% (имя), %rebirth_count% (текущее кол-во), %max_rebirth% (макс. кол-во)
RebirthScreenMessageEnabled = true
RebirthScreenMessage = Congratulations %player%! Rebirth status acquired.
RebirthScreenMessagePosition = TOP_CENTER
RebirthScreenMessageTime = 5000

# ---------------------------------------------------------------------------
# Настройки глобального оповещения на сервере
# ---------------------------------------------------------------------------

# Глобальное оповещение на весь сервер после успешного перерождения игрока.
# Доступные переменные: %player% (имя), %rebirth_count% (текущее кол-во), %max_rebirth% (макс. кол-во)
RebirthGlobalAnnouncementEnabled = true
RebirthGlobalAnnouncement = Congratulations %player% has reached Rebirth.
RebirthGlobalAnnouncementCritical = false