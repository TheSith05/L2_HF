# ---------------------------------------------------------------------------
# Настройки рейтов
# ---------------------------------------------------------------------------
# Значения по умолчанию соответствуют официальным (Retail). Любое изменение этих параметров сделает сервер «не по оффу».
# Внимание:
# Будьте предельно осторожны при внесении изменений. Убедитесь, что вы понимаете, на что влияет настройка, прежде чем менять её на работающем сервере.

# ---------------------------------------------------------------------------
# Стандартные настройки (значение по оффу (Retail) = 1)
# ---------------------------------------------------------------------------

# Множитель получаемого опыта (XP)
RateXp = 1
# Множитель получаемых очков навыков (SP)
RateSp = 1
# Множитель получаемого опыта в группе (Party XP)
RatePartyXp = 1
# Множитель получаемых очков навыков в группе (Party SP)
RatePartySp = 1
RateDropManor = 1
# Скорость уменьшения кармы
# Примечание: -1 означает использование RateXp, то есть будет использоваться официальный рейт для снятия кармы при смерти или получении опыта при убийстве мобов.
# По умолчанию: -1
RateKarmaLost = -1
RateKarmaExpLost = 1
RateSiegeGuardsPrice = 1

# Настройка шанса/количества получения предметов при использовании умений извлечения (например, рыбалка, распечатка предметов).
# По умолчанию: 1.
RateExtractable = 1.

# Множители увеличения/уменьшения уровня доверия на острове Hellbound
RateHellboundTrustIncrease = 1
RateHellboundTrustDecrease = 1


# ---------------------------------------------------------------------------
# Множители квестовых наград
# ---------------------------------------------------------------------------

# Множитель количества выпадаемых квестовых предметов.
QuestItemDropAmountMultiplier = 1

# Множители награды в виде опыта (XP) и очков навыков (SP) за квесты
RateQuestRewardXP = 1
RateQuestRewardSP = 1

# Множитель награды в виде адены (57 - Адена) за квесты
RateQuestRewardAdena = 1

# Использовать дополнительные множители для предметов?
# По умолчанию: False
UseQuestRewardMultipliers = False

# Множитель награды по умолчанию
# Если UseQuestRewardMultipliers=False - этот множитель применяется к любой награде
# Если UseQuestRewardMultipliers=True  - этот множитель применяется ко всем предметам, на которые не действуют дополнительные множители
# По умолчанию: 1
RateQuestReward = 1

# Дополнительные множители наград за квесты в зависимости от типа предмета
RateQuestRewardPotion = 1
RateQuestRewardScroll = 1
RateQuestRewardRecipe = 1
RateQuestRewardMaterial = 1

# Максимальная разница в уровнях между игроком и монстром для получения опыта.
MonsterExpMaxLevelDifference = 11


# ---------------------------------------------------------------------------
# Рейты дропа предметов
# ---------------------------------------------------------------------------
# Помните: если вы увеличите и шанс, и количество, итоговые рейты будут выше ожидаемых.
# Пример: если множитель количества 5 и множитель шанса 5, вы получите 5*5 = 25 рейтов дропа, будьте осторожны!

# Множитель количества предметов, выпадающих из монстров при их смерти.
DeathDropAmountMultiplier = 1
# Множитель количества предметов, получаемых при использовании скилла Спойл (Spoil).
SpoilDropAmountMultiplier = 1
# Множитель количества трав (Herb), выпадающих из монстров при их смерти.
HerbDropAmountMultiplier = 1
RaidDropAmountMultiplier = 1

# Множитель шанса выпадения предметов из монстров при их смерти.
DeathDropChanceMultiplier = 1
# Множитель шанса выпадения предметов при использовании скилла Спойл (Spoil).
SpoilDropChanceMultiplier = 1
# Множитель шанса выпадения трав (Herb) из монстров при их смерти.
HerbDropChanceMultiplier = 1
RaidDropChanceMultiplier = 1

# Список предметов с индивидуальными рейтами дропа по ID, теперь используется и для рейтов Адены.
# Формат: itemId1,multiplier1;itemId2,multiplier2;...
# Примечание: Убедитесь, что в списке НЕТ пробелов между числами!
# Пример для бижутерии с РБ (1x): 6656,1;6657,1;6658,1;6659,1;6660,1;6661,1;6662,1;8191,1;10170,1;10314,1
# Отключение дропа из мешков (Adventurer's Treasure Sack): 21747,0;21748,0;21749,0
# 57 - Адена
# По умолчанию: 57,1
DropAmountMultiplierByItemId = 57,1;6656,1;6657,1;6658,1;6659,1;6660,1;6661,1;6662,1;8191,1;10170,1;10314,1
DropChanceMultiplierByItemId = 57,1;21747,0;21748,0;21749,0

# Максимальное количество слотов дропа.
# Примечание: Предметы со 100% шансом дропа (без учета рейтов сервера) не учитываются в этом значении. Они будут выпадать как дополнительные предметы.
# Также групповой дроп с суммарным шансом более 100% может нарушить работу этой настройки.
DropMaxOccurrencesNormal = 2
DropMaxOccurrencesRaidboss = 7


# ---------------------------------------------------------------------------
# Настройки разницы уровней для дропа предметов
# ---------------------------------------------------------------------------

# Настройка разницы уровней для дропа Адены
# Минимальная и максимальная разница уровней для расчета штрафа
# Учитывается, насколько уровень игрока выше уровня монстра
# По умолчанию: 8
DropAdenaMinLevelDifference = 8
# Настройка максимальной разницы уровней для дропа Адены
# По умолчанию: 15
DropAdenaMaxLevelDifference = 15

# Минимальный шанс дропа Адены при превышении разницы уровней
# Значение 10 означает, что у монстра будет 10% шанс дропа, если разница уровней больше DropAdenaMaxLevelDifference
# Примечание: Значение плавно меняется от 100% до указанного лимита в диапазоне между DropAdenaMinLevelDifference и DropAdenaMaxLevelDifference
# По умолчанию: 10
DropAdenaMinLevelGapChance = 10

# Минимальная и максимальная разница уровней для расчета штрафа на дроп.
# Учитывается, насколько уровень игрока выше уровня монстра.
# По умолчанию: 5
DropItemMinLevelDifference = 5
# Максимальная разница уровней для расчета штрафа на дроп.
# По умолчанию: 10
DropItemMaxLevelDifference = 10

# Минимальный шанс дропа при превышении разницы уровней.
# Значение 10 означает, что у монстра будет 10% шанс дропа предмета, если разница уровней больше, чем DropAdenaMaxLevelDifference.
# Примечание: значение масштабируется от 100% до указанного значения в пределах от DropAdenaMinLevelDifference до DropAdenaMaxLevelDifference.
# По умолчанию: 10
DropItemMinLevelGapChance = 10

# Разрешить выпадение ивент-предметов в заданном диапазоне уровней между персонажем и монстром.
# По умолчанию: 9
EventItemMaxLevelDifference = 9


# ---------------------------------------------------------------------------
# Рейты системы Виталити (Vitality). Работает только если EnableVitality = True
# ---------------------------------------------------------------------------

# Настройка множителя опыта для каждого уровня Виталити. Всего 5 уровней, первый из которых равен 0 (без бонуса).
# Официальные рейты (Retail):
# Уровень 1: 150%
# Уровень 2: 200%
# Уровень 3: 250%
# Уровень 4: 300%
# Будьте осторожны при настройке, так как это сильно влияет на итоговый опыт!
# Пример: если рейты сервера 15x, а множитель Виталити 4-го уровня = 3, то итоговый рейт будет 45x (15x3)!
RateVitalityLevel1 = 1.5
RateVitalityLevel2 = 2.
RateVitalityLevel3 = 2.5
RateVitalityLevel4 = 3.

# Эти опции используются для изменения скорости получения/потери Виталити при убийстве мобов.
# По умолчанию: 1.
RateVitalityGain = 1.
RateVitalityLost = 0.6

# Определяет, во сколько раз быстрее восстанавливается Виталити у игроков, находящихся в мирных зонах (Peace Zones).
RateRecoveryPeaceZone = 1.

# Определяет, во сколько раз быстрее восстанавливается Виталити у игроков, находящихся в оффлайне.
# Примечание: необходимо включить опцию "RecoverVitalityOnReconnect", чтобы эта настройка заработала.
RateRecoveryOnReconnect = 4.


# ---------------------------------------------------------------------------
# Дроп предметов с игроков при смерти (значения в ПРОЦЕНТАХ)
# ---------------------------------------------------------------------------

PlayerDropLimit = 0
# Шанс дропа адены (57 - Адена) с игрока в %
PlayerRateDrop = 0
# Шанс дропа обычных предметов с игрока в %
PlayerRateDropItem = 0
# Шанс дропа экипировки с игрока в %
PlayerRateDropEquip = 0
# Шанс дропа оружия с игрока в %
PlayerRateDropEquipWeapon = 0

# Лимит количества предметов, выпадающих с игрока при наличии у него Кармы (ПК).
# По умолчанию: 10
KarmaDropLimit = 10

# Шанс дропа предметов при смерти персонажа с кармой (ПК)
# По умолчанию: 40
KarmaRateDrop = 40

# Шанс дропа обычных предметов из инвентаря при смерти персонажа с кармой (ПК)
# По умолчанию: 50
KarmaRateDropItem = 50

# Шанс дропа экипировки при смерти персонажа с кармой (ПК)
# По умолчанию: 40
KarmaRateDropEquip = 40

# Шанс дропа оружия при смерти персонажа с кармой (ПК)
# По умолчанию: 10
KarmaRateDropEquipWeapon = 10


# ---------------------------------------------------------------------------
# Настройки питомцев (По умолчанию: 1)
# ---------------------------------------------------------------------------

PetXpRate = 1
PetFoodRate = 1
SinEaterXpRate = 1


# ---------------------------------------------------------------------------
# Дополнительный дроп с рейдовых боссов (за исключением эпических боссов)
# ---------------------------------------------------------------------------

BossDropEnable = False
BossDropMinLevel = 40
BossDropMaxLevel = 999

# Настройка дополнительных предметов в дропе боссов
# Формат: itemId1,minAmount1,maxAmount1,chance1;itemId2...
# По умолчанию: Золото Эйнхасад (4356), мин: 1 шт., макс: 2 шт., шанс выпадения 100%
# ВНИМАНИЕ: Шанс дропа также увеличивается от уровня VIP, рун и других бонусов.
BossDropList = 4356,1,2,100;

