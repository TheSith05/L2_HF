# ---------------------------------------------------------------------------
# Настройки Gracia Seeds
# ---------------------------------------------------------------------------
# Значения по умолчанию соответствуют официальным. Любое изменение этих настроек приведет к отклонению от механики оффа (Retail).
# Внимание:
# Будьте предельно осторожны при внесении изменений. Убедитесь, что вы понимаете последствия перед применением настроек на живом сервере.

# ---------------------------------------------------------------------------
# Настройки Seed of Destruction (Семечко Разрушения)
# ---------------------------------------------------------------------------

# Количество убийств, необходимое для перехода на 2-ю стадию
# По умолчанию: 10
TiatKillCountForNextState = 10

# Длительность 2-й стадии перед началом фазы защиты (в минутах).
# По умолчанию: 720 мин (12 ч)
Stage2Length = 720


# ---------------------------------------------------------------------------
# Настройки Тиат (Tiat)
# ---------------------------------------------------------------------------
# Минимальный уровень игрока для входа
# По умолчанию: 75
MinLevel = 75

# Минимальное количество участников в командном канале (Command Channel)
# По умолчанию: 36
MinPlayers = 36

# Максимальное количество участников в командном канале (Command Channel)
# По умолчанию: 45
MaxPlayers = 45


# ---------------------------------------------------------------------------
# Настройки Seed of Infinity (Семечко Бессмертия)
# ---------------------------------------------------------------------------
# Количество убийств Экимуса (Ekimus), необходимое для открытия 3-й стадии.
# По умолчанию: 5
EkimusKillCount = 5

# Атака на Зал Эрозии (Erosion Hall) — минимальное и максимальное количество игроков
# По умолчанию: 18
MinEroAttPlayers = 18
# Максимальное количество игроков для атаки на Зал Эрозии
# По умолчанию: 27
MaxEroAttPlayers = 27

# Защита Зала Эрозии (Erosion Hall) — минимальное и максимальное количество игроков
# По умолчанию: 18
MinEroDefPlayers = 18
# Настройки Seed of Infinity
# Максимальное количество игроков для защиты Зала Эрозии
# По умолчанию: 27
MaxEroDefPlayers = 27

# Атака на Зал Сердца (Heart Hall) — минимальное и максимальное количество игроков
# По умолчанию: 18
MinHeaAttPlayers = 18
# Максимальное количество игроков для атаки на Зал Сердца
# По умолчанию: 27
MaxHeaAttPlayers = 27

# Защита Зала Сердца (Heart Hall) — минимальное и максимальное количество игроков
# По умолчанию: 18
MinHeaDefPlayers = 18
# Максимальное количество игроков в команде на ивентах (например, TvT или CTF).
# По умолчанию: 27
MaxHeaDefPlayers = 27
