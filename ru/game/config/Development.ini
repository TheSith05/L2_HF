# ---------------------------------------------------------------------------
# Настройки разработки
# ---------------------------------------------------------------------------
# Не меняйте эти параметры, если не уверены в своих действиях.
# Эти настройки предназначены ТОЛЬКО для отладочных серверов. Они не подходят для LIVE-серверов.

# Отображать время, затраченное на загрузку каждого раздела инициализации сервера при запуске.
# Если включено, в логах будет отображаться время завершения загрузки базы данных, пула потоков, скиллов, предметов и т.д.
# Полезно для выявления медленных этапов запуска и узких мест производительности.
# По умолчанию: False
LogServerLoadTimes = False

# Отладка кэша действий HTML-интерфейса.
# По умолчанию: False
HtmlActionCacheDebug = False

# Отключить загрузку квестов.
# По умолчанию: False
NoQuests = False

# Отключить загрузку таблицы спавна (NPC и мобов).
# По умолчанию: False
NoSpawns = False

# Отображать квесты в логах во время их загрузки.
# По умолчанию: False
ShowQuestLoadInLogs = False

# Отображать скрипты в логах во время их загрузки.
# По умолчанию: False
ShowScriptLoadInLogs = False

# Отладка пакетов, приходящих от клиента.
# По умолчанию: False
DebugClientPackets = False

# Отладка расширенных (Ex) пакетов клиента.
# По умолчанию: False
DebugExClientPackets = False

# Отладка пакетов, отправляемых сервером.
# По умолчанию: False
DebugServerPackets = False

# Отладка неизвестных пакетов.
# По умолчанию: True
DebugUnknownPackets = True

# Список исключенных пакетов.
# Названия пакетов, которые будут исключены из отладки, разделяются запятыми.
ExcludedPacketList = AbnormalStatusUpdate, AcquireSkillList, Attack, AutoAttackStart, AutoAttackStop, DeleteObject, ExAutoSoulShot, ExPacket, ExStorageMaxCount, ExUserInfoAbnormalVisualEffect, ExUserInfoEquipSlot, MoveToLocation, NpcInfo, NpcSay, SkillCoolTime, SocialAction, StatusUpdate, UserInfo, ValidatePosition
