# ---------------------------------------------------------------------------
# Настройки NPC
# ---------------------------------------------------------------------------
# Этот файл свойств предназначен исключительно для модификации NPC и настроек, которые напрямую на них влияют.
# Значения по умолчанию соответствуют официальному серверу (Retail). Изменение этих настроек приведет к отклонению от механик официального сервера.
# Внимание:
# Будьте предельно осторожны при внесении изменений. Убедитесь, что вы понимаете, что именно меняете, прежде чем применять настройки на рабочем сервере.

# ---------------------------------------------------------------------------
# Общие
# ---------------------------------------------------------------------------

# Глобальные оповещения о местах появления (спавна) Кузнеца Маммона и Торговца Маммоном.
# По умолчанию: False
AnnounceMammonSpawn = False

# True - Мобы могут проявлять агрессию, находясь в мирных зонах (Peace Zones).
# False - Мобы НЕ могут проявлять агрессию в мирных зонах.
# По умолчанию: True
AltMobAgroInPeaceZone = True

# Определяет, можно ли атаковать NPC по умолчанию.
# По оффу (Retail): True
AltAttackableNpcs = True

# Позволяет обычным игрокам (не ГМам) просматривать статы NPC через Shift+клик.
# По умолчанию: False
AltGameViewNpc = False

# Отображение уровня NPC над головой.
# По умолчанию: False
ShowNpcLevel = False

# Отображение агрессивности NPC (иконка агрессии).
# По умолчанию: False
ShowNpcAggression = False

# Атакуемые NPC (мобы) не оставляют трупы игроков.
AttackablesCampPlayerCorpses = False

# Показывать значки кланов и альянсов для территориальных NPC без выполнения квестов.
# По умолчанию: False
ShowCrestWithoutQuest = False

# Кастомный случайный эффект заточки оружия у NPC.
# Все NPC с оружием получают случайное визуальное свечение заточки.
# Эффект только визуальный, диапазон свечения от 4 до 21.
# По умолчанию: False
EnableRandomEnchantEffect = False

# NPC передвигаются и используют скиллы со своей стандартной скоростью.
# Если отключено, скорость передвижения NPC будет зависеть от бонуса DEX, а скорость каста — от бонуса WIT, как у игроков.
# Требуется перезагрузка сервера.
# По умолчанию: True
NpcSpeedsWithoutStatBonus = True

# Минимальный уровень NPC для применения правила Gracia Epilogue:
# "Урон по монстрам будет снижен, если ваш персонаж на 2 или более уровней ниже монстра 78+ уровня."
# Примечание:
# Если хотите отключить эту функцию, установите значение 99.
# По умолчанию: 78
MinNPCLevelForDmgPenalty = 78

# Штраф в процентах при разнице уровней от -2 до -5.
# По умолчанию:
# обычный урон - 0.7, 0.6, 0.6, 0.55
# критический урон - 0.75, 0.65, 0.6, 0.58
# урон скиллами - 0.8, 0.7, 0.65, 0.62
DmgPenaltyForLvLDifferences = 0.7, 0.6, 0.6, 0.55
CritDmgPenaltyForLvLDifferences = 0.75, 0.65, 0.6, 0.58
SkillDmgPenaltyForLvLDifferences = 0.8, 0.7, 0.65, 0.62

# Минимальный уровень NPC для применения правила Gracia Epilogue:
# "Если уровень персонажа на 3 или более уровней ниже уровня монстра, шанс того, что монстр сможет отразить магическое заклинание, увеличивается."
# Примечание:
# Если хотите отключить эту функцию, установите значение 99.
# По умолчанию: 78
MinNPCLevelForMagicPenalty = 78

# Штраф в процентах к шансу прохождения скиллов при разнице уровней от -3 до -6
# По умолчанию: 2.5, 3.0, 3.25, 3.5
SkillChancePenaltyForLvLDifferences = 2.5, 3.0, 3.25, 3.5


# ---------------------------------------------------------------------------
# Монстры
# ---------------------------------------------------------------------------

# Интервал задачи очистки трупов (не ставьте слишком низкое значение!) (в миллисекундах):
# По умолчанию: 5000
DecayTimeTask = 5000

# Время исчезновения трупа по умолчанию (в секундах).
# По умолчанию: 7
DefaultCorpseTime = 7

# Время, которое добавляется к таймеру исчезновения трупа, если он был проспойлен (в секундах).
# По умолчанию: 10
SpoiledCorpseExtendTime = 10

# Время, в течение которого можно использовать скиллы поглощения трупов (например, 42 - Sweeper/Спойл) до того, как труп исчезнет.
# По умолчанию: 2000
CorpseConsumeSkillAllowedTimeBeforeDecay = 2000

# Максимальная дистанция, с которой мобы могут сагриться.
# Подробности по ссылке: https://l2jserver.com/forum/viewtopic.php?f=128&t=31588
# По умолчанию: 1500
# L2jMobius: 450
MaxAggroRange = 450

# Максимальное расстояние, на которое монстры могут случайно отойти от точки спавна.
# По умолчанию: 300
MaxDriftRange = 300
 
# Включить проверку дистанции агро монстров.
# Если включено, монстры потеряют агро, если их отвести слишком далеко от точки спавна.
# По умолчанию: False
AggroDistanceCheckEnabled = False

# Максимальное расстояние, на которое монстров можно отвести от точки спавна.
# Переопределяется параметром chaseRange в настройках спавна.
# По умолчанию: 2000
AggroDistanceCheckRange = 2000

# Использовать проверку максимальной дистанции агро для рейд-боссов.
# Гранд-боссы исключены.
# По умолчанию: False
AggroDistanceCheckRaids = False

# Максимальное расстояние, на которое можно отвести рейд-босса от точки спавна.
# Переопределяется параметром chaseRange в настройках спавна.
# По умолчанию: 4000
AggroDistanceCheckRaidRange = 4000

# Использовать проверку максимальной дистанции агро внутри инстанс-зон.
# По умолчанию: False
AggroDistanceCheckInstances = False

# Восстанавливать HP и MP монстра, когда агро сбрасывается из-за дистанции.
# По умолчанию: True
AggroDistanceCheckRestoreLife = True


# ---------------------------------------------------------------------------
# Стражники
# ---------------------------------------------------------------------------

# True - Разрешает стражникам атаковать агрессивных мобов в радиусе видимости.
# По умолчанию: False
GuardAttackAggroMob = False


# ---------------------------------------------------------------------------
# Питомцы
# ---------------------------------------------------------------------------

# Эта опция включает или отключает менеджера виверн, находящегося в каждом замке,
# для выращивания виверн и страйдеров из детенышей.
# По умолчанию: False
AllowWyvernUpgrader = False

# Список NPC, у которых можно арендовать питомцев.
# Пример: 30827 (Pet Manager), 32471, 34486, 36547
# По умолчанию: 30827
ListPetRentNpc = 30827

# Контроль лимита слотов в инвентаре питомца (НЕ лимит веса).
# По умолчанию: 12
MaximumSlotsForPet = 12

# Множитель регенерации HP/MP для питомцев.
# По умолчанию: 100, 100
PetHpRegenMultiplier = 100
PetMpRegenMultiplier = 100


# ---------------------------------------------------------------------------
# Рейд-боссы
# ---------------------------------------------------------------------------

# Процент регенерации HP и MP для рейд-боссов.
# Пример: Установка значения 10 заставит HP рейд-босса восстанавливаться на 90% медленнее обычного.
# По умолчанию: 100, 100
RaidHpRegenMultiplier = 100
RaidMpRegenMultiplier = 100

# Процент физической и магической защиты для рейд-боссов.
# Пример: Значение 10 снизит защиту на 90% от нормы, а 110 увеличит на 10%.
# По умолчанию: 100, 100
RaidPDefenceMultiplier = 100
RaidMDefenceMultiplier = 100

# Процент физической и магической атаки для рейд-боссов.
# Пример: Значение 10 снизит атаку на 90% от нормы, а 110 увеличит на 10%.
# По умолчанию: 100, 100
RaidPAttackMultiplier = 100
RaidMAttackMultiplier = 100

# Настройка множителя минимального и максимального времени респауна рейд-боссов.
# По умолчанию 12 часов * 1.0 для минимума и 24 часа * 1.0 для максимума.
# Пример: Установка RaidMaxRespawnMultiplier в 2 увеличит время между респаунами до 24-48 часов.
# По умолчанию: 1.0, 1.0
RaidMinRespawnMultiplier = 1.0
RaidMaxRespawnMultiplier = 1.0

# Настройка интервала респауна миньонов рейд-босса.
# Время в миллисекундах, 1 минута = 60000 мс.
# По умолчанию: 300000
RaidMinionRespawnTime = 300000

# Упрощенное управление миньонами с нестандартным статичным респауном — без лишнего кода, через конфиг.
# Формат: id_миньона1,время_в_сек1;id_миньона2,время_в_сек2
CustomMinionsRespawnTime = 22450,30;22371,120;22543,0;25545,0;22424,30;22425,30;22426,30;22427,30;22428,30;22429,30;22430,30;22432,30;22433,30;22434,30;22435,30;22436,30;22437,30;22438,30;25596,30;25605,0;25606,0;25607,0;25608,0

# Принудительное удаление миньонов после смерти их хозяина.
# По умолчанию миньоны удаляются только у рейд-боссов.
# По умолчанию: False
ForceDeleteMinions = False

# Отключить проклятие рейд-босса (Raid Curse), если уровень игрока более чем на 8 уровней ниже уровня босса.
# По умолчанию: False
DisableRaidCurse = False

# Настройка интервала в секундах, в течение которого рейдовые боссы и их миньоны не будут менять свою текущую цель.
# 1 минута = 60 секунд.
# По умолчанию: 10,10,10
RaidChaosTime = 30
GrandChaosTime = 30
MinionChaosTime = 30
