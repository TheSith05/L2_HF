# ---------------------------------------------------------------------------
# Настройка потоков сервера
# ---------------------------------------------------------------------------

# Определяет количество потоков в пуле планировщика задач.
# Если установлено -1, значение будет равно количеству доступных ядер процессора, умноженному на 4.
# Вы можете указать положительное целое число для ручной настройки размера пула.
# Дополнительно создается пул высокого приоритета, размер которого составляет четверть от основного пула планировщика.
# Примечание: высокие значения могут улучшить обработку задач при большой нагрузке, но могут увеличить потребление CPU и оперативной памяти.
ScheduledThreadPoolSize = -1

# Определяет количество потоков в пуле мгновенных задач.
# Если установлено -1, значение будет равно количеству доступных ядер процессора, умноженному на 2.
# Вы можете указать положительное целое число для ручной настройки размера пула.
# Примечание: высокие значения могут улучшить обработку задач при большой нагрузке, но могут увеличить потребление CPU и оперативной памяти.
InstantThreadPoolSize = -1

# Использовать многопоточность для ускорения запуска сервера.
# По умолчанию: False
ThreadsForLoading = False
