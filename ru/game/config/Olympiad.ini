# ---------------------------------------------------------------------------
# Настройки Великой Олимпиады
# ---------------------------------------------------------------------------

# Значения по умолчанию соответствуют официальному серверу (Retail).
# Изменение этих настроек приведет к отклонению от механик официального сервера.
# Внимание:
# Будьте предельно осторожны при изменении любых параметров.
# Убедитесь, что вы полностью понимаете, на что влияют настройки, прежде чем менять их на работающем сервере.
# ---------------------------------------------------------------------------

# Включить проведение Великой Олимпиады.
# По умолчанию: True
OlympiadEnabled = True

# Час начала Олимпиады (в 24-часовом формате). По умолчанию 18:00.
# По умолчанию: 18
OlympiadStartTime = 18

# Минуты начала Олимпиады. По умолчанию 00 (начало часа).
# По умолчанию: 00
OlympiadMin = 00

# Максимальное количество баффов, разрешенных на Олимпиаде.
# По умолчанию: 5
OlympiadMaxBuffs = 5

# Длительность периода соревнований Олимпиады (в миллисекундах). По умолчанию 6 часов.
# (Если меняете значение, рекомендуется использовать шаг в 10 минут)
# По умолчанию: 21600000
OlympiadCPeriod = 21600000

# Длительность боя на Олимпиаде (в миллисекундах). По умолчанию 5 минут.
# По умолчанию: 300000
OlympiadBattle = 300000

# Длительность еженедельного периода Олимпиады (в миллисекундах). По умолчанию 1 неделя.
# Используется для начисления очков дворянам (Noblesse).
# По умолчанию: 604800000
OlympiadWPeriod = 604800000

# Длительность периода валидации (ожидания) Олимпиады (в миллисекундах). По умолчанию 24 часа.
# По умолчанию: 86400000
OlympiadVPeriod = 86400000

# Количество очков, выдаваемых при получении статуса дворянина (Noblesse) впервые.
# По умолчанию: 10
OlympiadStartPoints = 10

# Количество очков, начисляемых еженедельно.
# По умолчанию: 10
OlympiadWeeklyPoints = 10

# Минимальное количество участников для запуска классовых боев.
# По умолчанию: 11
OlympiadClassedParticipants = 5

# Минимальное количество участников для запуска внеклассовых боев.
# По умолчанию: 11
OlympiadNonClassedParticipants = 9

# Минимальное количество участников для запуска командных боев 3x3.
# По умолчанию: 6
OlympiadTeamsParticipants = 6

# Число, используемое для отображения количества зарегистрированных участников в сообщениях "Меньше чем..." или "Больше чем...".
# 0 для отображения точного числа вместо текстовой фразы (старый стиль).
# По умолчанию: 100
OlympiadRegistrationDisplayNumber = 100

# Награда за классовые бои на Олимпиаде.
# Формат: itemId1,itemNum1;itemId2,itemNum2...
# 13722 - Olympiad Token (Токен Олимпиады).
# По умолчанию: 13722,50
OlympiadClassedReward = 13722,50

# Награда за внеклассовые бои на Олимпиаде.
# Формат: itemId1,itemNum1;itemId2,itemNum2...
# 13722 - Olympiad Token (Токен Олимпиады).
# По умолчанию: 13722,40
OlympiadNonClassedReward = 13722,40

# Награда за командные бои 3x3 на Олимпиаде.
# Формат: itemId1,itemNum1;itemId2,itemNum2...
# 13722 - Olympiad Token (Токен Олимпиады).
# По умолчанию: 13722,85
OlympiadTeamReward = 13722,85

# ID предмета, используемого для обмена на очки Олимпиады.
# 13722 - Olympiad Token (Токен Олимпиады).
# По умолчанию: 13722
OlympiadCompRewItem = 13722

# Минимальное количество боев, необходимое для получения награды очками Олимпиады.
# По умолчанию: 15
OlympiadMinMatchesForPoints = 15

# Курс обмена очков Олимпиады на награду (токены).
# По умолчанию: 1000
OlympiadGPPerPoint = 1000

# Количество очков дворянина (Noblesse), выдаваемое Героям.
# По умолчанию: 200
OlympiadHeroPoints = 200

# Количество очков дворянина (Noblesse), выдаваемое игрокам 1-го ранга.
# По умолчанию: 100
OlympiadRank1Points = 100

# Количество очков дворянина (Noblesse), выдаваемое игрокам 2-го ранга.
# По умолчанию: 75
OlympiadRank2Points = 75

# Количество очков дворянина (Noblesse), выдаваемое игрокам 3-го ранга.
# По умолчанию: 55
OlympiadRank3Points = 55

# Количество очков дворянина (Noblesse), выдаваемое игрокам 4-го ранга.
# По умолчанию: 40
OlympiadRank4Points = 40

# Количество очков дворянина (Noblesse), выдаваемое игрокам 5-го ранга.
# По умолчанию: 30
OlympiadRank5Points = 30

# Максимальное количество очков, которое игрок может получить или потерять за один бой.
# По умолчанию: 10
OlympiadMaxPoints = 10

# Показывать в таблице Героев победителей прошлого месяца или текущий статус.
# По умолчанию: True
OlympiadShowMonthlyWinners = True

# Менеджеры Олимпиады объявляют о начале каждого боя.
# По умолчанию: True
OlympiadAnnounceGames = True

# Список предметов, запрещенных на Олимпиаде. ID предметов должны быть разделены запятыми (например, 57 - Адена, 42 - Sweeper).
# Экипированные запрещенные предметы будут перемещены в инвентарь при телепортации на арену.
# По умолчанию: (пусто)
OlympiadRestrictedItems = 

# Отключить использование Благословенных Зарядов Духа (Blessed Spiritshots).
# По умолчанию: False
OlympiadDisableBlessedSpiritShots = False

# Лимит заточки предметов во время боев на Олимпиаде. -1 означает отсутствие ограничений.
# По умолчанию: -1
OlympiadEnchantLimit = -1

# Логировать все бои на Олимпиаде и их результаты в файл olympiad.csv.
# По умолчанию: False
OlympiadLogFights = False

# Время ожидания перед телепортацией на арену.
# По умолчанию: 120
OlympiadWaitTime = 120

# Делитель для расчета очков в классовых и внеклассовых боях.
# По умолчанию: 5, 5
OlympiadDividerClassed = 5
OlympiadDividerNonClassed = 5

# Максимальное количество боев, которое может провести персонаж со статусом Дворянин (Noblesse) в неделю.
# По умолчанию: 70
OlympiadMaxWeeklyMatches = 70

# Максимальное количество внеклассовых (non-classed) боев, которое персонаж может провести в неделю.
# По умолчанию: 60
OlympiadMaxWeeklyMatchesNonClassed = 60

# Максимальное количество классовых (classed) боев, которое персонаж может провести в неделю.
# По умолчанию: 30
OlympiadMaxWeeklyMatchesClassed = 30

# Максимальное количество командных боев, которое персонаж может провести в неделю.
# По умолчанию: 10
OlympiadMaxWeeklyMatchesTeam = 10


# ---------------------------------------------------------------------------
# Настройка пользовательского периода Олимпиады.
# ---------------------------------------------------------------------------
# Пример для Олимпиады каждые 2 недели:
# OlympiadUseCustomPeriodSettings = True
# OlympiadPeriod = WEEK
# OlympiadPeriodMultiplier = 2
# ---------------------------------------------------------------------------
# Включить/выключить пользовательские настройки периода.
# По умолчанию: False
OlympiadUseCustomPeriodSettings = False

# Изменение типа задержки между двумя циклами Олимпиады.
# Доступные значения: MONTH (месяц), WEEK (неделя), DAY (день).
# По умолчанию: MONTH
OlympiadPeriod = MONTH

# Изменение частоты проведения Олимпиады.
# Значение является множителем типа периода.
# Например, если тип MONTH и множитель 2, то Олимпиада будет проходить раз в 2 месяца.
# По умолчанию: 1
# Внимание! Если тип = DAY, множитель должен быть >= 7!
OlympiadPeriodMultiplier = 1

# Разрешить проведение соревнований только в определенные дни недели.
# По умолчанию: 1,2,3,4,5,6,7 (ВОСКРЕСЕНЬЕ, ПОНЕДЕЛЬНИК, ВТОРНИК, СРЕДА, ЧЕТВЕРГ, ПЯТНИЦА, СУББОТА)
OlympiadCompetitionDays = 1,2,3,4,5,6,7
