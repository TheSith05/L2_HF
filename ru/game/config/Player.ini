# Если разница попадает во второй диапазон, персонаж с самым низким уровнем в пати получит только 30% опыта от того, что получают остальные.
# Если разница попадает в последний диапазон, персонаж с самым низким уровнем не получит опыта вовсе.
# По умолчанию: 0,9;10,14;15,99
