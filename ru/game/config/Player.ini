# ---------------------------------------------------------------------------
# Настройки игрока
# ---------------------------------------------------------------------------
# Этот файл свойств предназначен исключительно для конфигураций, напрямую влияющих на игроков.
# Значения по умолчанию соответствуют официальным серверам (Retail). Изменение этих настроек приведет к отклонению от оффа.
# Внимание:
# Будьте предельно осторожны при внесении изменений. Убедитесь, что вы понимаете, что именно меняете, прежде чем применять настройки на живом сервере.

# ---------------------------------------------------------------------------
# Статистика
# ---------------------------------------------------------------------------

# Если включено, персонаж будет терять уровень (делевел), если после смерти его опыт становится ниже текущего уровня. Если False, персонаж не потеряет уровень даже при нехватке опыта.
# По умолчанию: True
Delevel = True

# Включает проверку всех скиллов игрока на соответствие уровню.
# Если уровень игрока ниже уровня изучения скилла на 9 и более, уровень скилла понижается до максимально возможного.
# Если подходящего уровня нет, скилл удаляется у игрока.
DecreaseSkillOnDelevel = True

# Множитель лимита веса (инвентаря). Например, значение 5 даст игрокам лимит веса в 5 раз больше обычного.
# По умолчанию: 1
AltWeightLimit = 1

# Модификатор скорости бега. Например, значение 5 даст игрокам +5 к скорости бега.
# По умолчанию: 0
RunSpeedBoost = 0

# Шанс получения дебаффа Death Penalty (штраф смерти) при гибели от мобов.
# По умолчанию: 20
DeathPenaltyChance = 20

# Процент HP, MP и CP, восстанавливаемый при воскрешении персонажа.
# Установите 0, чтобы отключить восстановление.
# По умолчанию: 0, 65, 0
RespawnRestoreCP = 0
RespawnRestoreHP = 65
RespawnRestoreMP = 0

# Процент регенерации HP, MP и CP для игроков.
# Пример: установка HP на 10 приведет к тому, что HP игрока будет восстанавливаться на 90% медленнее обычного.
# По умолчанию: 100, 100, 100
