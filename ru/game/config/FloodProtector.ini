# ---------------------------------------------------------------------------
# Настройки защиты от флуда (FloodProtector)
# ---------------------------------------------------------------------------
# Следующие параметры могут быть применены к каждой функции:
# Interval - интервал в тиках игрового сервера (1 тик = 100мс), в течение которого разрешен только один запрос
# LogFlooding - логировать ли флуд (логируется только первое событие и общее количество флуд-запросов)
# PunishmentLimit - если количество запросов в одном интервале превышает указанное число, применяется наказание (0 = отключить наказание)
# PunishmentType - тип наказания ('none', 'kick', 'ban', 'jail'), работает только если PunishmentLimit > 0
# PunishmentTime - длительность наказания в минутах для тюрьмы (jail) или бана (ban) (0 = навсегда)

# UseItem - защита от флуда при использовании предметов
# Интервал использования предметов
# Отключено по оффу (Retail), если хотите включить защиту, установите значение, например, 4.
# По умолчанию: 0
FloodProtectorUseItemInterval = 0
FloodProtectorUseItemLogFlooding = False
FloodProtectorUseItemPunishmentLimit = 0
FloodProtectorUseItemPunishmentType = none
FloodProtectorUseItemPunishmentTime = 0

# RollDice - защита от флуда при броске костей (команда /dice)
