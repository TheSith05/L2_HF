# --------------------------------------------------
# Общие настройки для захватываемых кланхоллов
# --------------------------------------------------

# Минимальный уровень клана, необходимый для регистрации
# на осаду
MinClanLevel = 4

# Максимальное количество кланов, которые могут зарегистрироваться
# на битву
MaxAttackers = 500

# Максимальное количество флагов, которые может установить
# каждый клан
MaxFlagsPerClan = 1

# Включить награду в виде очков славы (Fame)
EnableFame = false

# Количество очков славы (Fame)
FameAmount = 0

# Частота начисления очков славы (Fame)
FameFrequency = 0
