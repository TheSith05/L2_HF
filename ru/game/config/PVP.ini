# ---------------------------------------------------------------------------
# Настройки, связанные с PvP
# ---------------------------------------------------------------------------
# Значения по умолчанию соответствуют официальному серверу (Retail). Изменение этих настроек приведет к отклонению от механик оффа.
# Внимание:
# Будьте предельно осторожны при внесении изменений. Убедитесь, что вы понимаете, на что влияете, прежде чем применять настройки на живом сервере.
# ---------------------------------------------------------------------------
# Настройки дропа предметов при смерти ПК
# ---------------------------------------------------------------------------

# Определяет, может ли ГМ терять экипировку при смерти.
# По умолчанию: False
CanGMDropEquipment = False

# Внимание: Убедитесь, что в списках НЕТ лишних пробелов между числами!
# Список предметов питомцев, которые нельзя выронить при смерти.
# По умолчанию: 2375,3500,3501,3502,4422,4423,4424,4425,6648,6649,6650
ListOfPetItems = 2375,3500,3501,3502,4422,4423,4424,4425,6648,6649,6650

# Список предметов, которые НИКОГДА не должны выпадать (примечание: 57 - Адена никогда не выпадает, независимо от этого списка).
# По умолчанию: 57,1147,425,1146,461,10,2368,7,6,2370,2369,6842,6611,6612,6613,6614,6615,6616,6617,6618,6619,6620,6621,7694,8181,5575,7694,9388,9389,9390
ListOfNonDroppableItems = 57,1147,425,1146,461,10,2368,7,6,2370,2369,6842,6611,6612,6613,6614,6615,6616,6617,6618,6619,6620,6621,7694,8181,5575,7694,9388,9389,9390

# Минимальное количество очков ПК для начала выпадения предметов.
# По умолчанию: 6
MinimumPKRequiredToDrop = 6


# ---------------------------------------------------------------------------
# Анти-фид (защита от накрутки)
# ---------------------------------------------------------------------------

# Включает защиту от накрутки PvP/PK очков и клановой репутации.
# По умолчанию: False
AntiFeedEnable = False

# Если True, убийства персонажей с одного IP (дуалбокс) не будут давать PvP/PK очки и клановую репутацию.
# По умолчанию: True
AntiFeedDualbox = True

# Если True, сервер будет считать персонажей с неопределенным IP (отключенных) как дуалбокс.
# По умолчанию: True
AntiFeedDisconnectedAsDualbox = True

# Если персонаж умер быстрее этого интервала, убийца не получит PvP/PK очки и клановую репутацию.
# Установка 0 отключает эту функцию.
# По умолчанию: 120 секунд.
AntiFeedInterval = 120


# ---------------------------------------------------------------------------
# Разное
# ---------------------------------------------------------------------------

# Начислять ли PvP очко за убийство игрока с кармой (ПК)?
# По умолчанию: False
AwardPKKillPVPPoint = False

# Время нахождения в PvP-режиме после атаки обычного игрока (в миллисекундах).
# По умолчанию: 120000
PvPVsNormalTime = 120000

# Время нахождения в PvP-режиме после атаки фиолетового (PvP) игрока (в миллисекундах).
# По умолчанию: 60000
PvPVsPvPTime = 60000

# ---------------------------------------------------------------------------
# Флаг (PvP-режим) при атаке Рейд-боссов или Чемпионов (Open World PvP)
# ---------------------------------------------------------------------------

# Флаг (ПвП-статус) игрока при атаке Рейд-босса.
# Для работы остальных настроек эта опция должна быть включена.
# По умолчанию: false
FlagPlayerOnRaidAttack = false

# Флаг (ПвП-статус) игрока при атаке монстра-чемпиона.
# По умолчанию: false
FlagPlayerOnChampionAttack = false

# Флаг (ПвП-статус) владельца, если его саммон или питомец атакует Рейд-босса или чемпиона (физические удары + атакующие скиллы).
# По умолчанию: false
FlagPlayerOnSummonPetRaidChampionAttack = false